          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { DEFAULT_CONFIG, merge } from './defaults.js';

          const HOME = process.env.APPDATA || process.env.XDG_CONFIG_HOME || path.join(os.homedir(), '.config');
          export const DATA_DIR = process.env.DQA_DATA
            ? path.resolve(process.env.DQA_DATA)
            : path.join(HOME, 'DiscordQuestsAuto');

          fs.mkdirSync(DATA_DIR, { recursive: true });

          const cfgPath = path.join(DATA_DIR, 'config.json');
          let cache = null;

          export function cfg() {
            if (cache) return cache;
            let disk = {};
            try { disk = JSON.parse(fs.readFileSync(cfgPath, 'utf8')); } catch (e) {}
            cache = merge(DEFAULT_CONFIG, disk);
            cache.dataDir = DATA_DIR;
            if (process.env.DISCORD_TOKEN) cache.token = process.env.DISCORD_TOKEN;
            return cache;
          }

          export function save(patch) {
            cache = merge(cfg(), patch || {});
            const tmp = cfgPath + '.tmp';
            fs.writeFileSync(tmp, JSON.stringify(cache, null, 2));
            fs.renameSync(tmp, cfgPath);
            return cache;
          }

          export const nodeStorage = {
            get(k) {
              try { return JSON.parse(fs.readFileSync(path.join(DATA_DIR, k + '.json'), 'utf8')); }
              catch (e) { return null; }
            },
            set(k, v) {
              try { fs.writeFileSync(path.join(DATA_DIR, k + '.json'), JSON.stringify(v)); } catch (e) {}
            }
          };
