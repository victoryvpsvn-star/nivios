          import { DiscordClient, sleep, humanDelay, progressSteps } from '../discord/api.js';

          const DUR = new Set(['WATCH_VIDEO', 'WATCH_VIDEO_ON_MOBILE']);
          const HB = new Set(['PLAY_ON_DESKTOP', 'PLAY_ON_DESKTOP_V2', 'STREAM_ON_DESKTOP', 'PLAY_ACTIVITY', 'PLAY_ON_XBOX', 'PLAY_ON_PLAYSTATION']);
          const ACH = new Set(['ACHIEVEMENT_IN_GAME', 'ACHIEVEMENT_IN_ACTIVITY']);

          function tasksOf(q) {
            return Object.values((q && q.config && q.config.task_config_v2 && q.config.task_config_v2.tasks) || {});
          }
          function nameOf(q) {
            return (q && q.config && q.config.messages && q.config.messages.quest_name)
              || (q && q.config && q.config.application && q.config.application.name)
              || (q && q.id);
          }

          export function progressOf(q) {
            const st = (q && q.user_status) || {};
            const prog = st.progress || {};
            let cur = 0;
            for (const k of Object.keys(prog)) cur += (prog[k].value || 0);
            let tgt = 0;
            for (const t of tasksOf(q)) tgt += (t.target || 0);
            if (!tgt) tgt = 1;
            return {
              enrolled: !!st.enrolled_at,
              completed: !!st.completed_at,
              claimed: !!st.claimed_at,
              pct: Math.min(100, Math.round((cur / tgt) * 100))
            };
          }

          export class Engine {
            constructor(opts) {
              this.getConfig = opts.getConfig;
              this.log = opts.onLog || function () {};
              this.onState = opts.onState || function () {};
              this.client = new DiscordClient({
                token: opts.token,
                getConfig: opts.getConfig,
                onLog: this.log,
                storage: opts.storage
              });
              this.stop = false;
              this.running = false;
              this.state = { me: null, orbs: 0, quests: [], stats: { ok: 0, fail: 0, skip: 0 } };
            }

            emit() { this.onState(this.state); }

            async scan() {
              const me = await this.client.me();
              if (me && me.code === 401) throw new Error('Token khong hop le');
              this.state.me = { id: me.id, username: me.username, global_name: me.global_name };

              const d = await this.client.myQuests();
              const list = ((d && d.quests) || []).filter(function (q) { return q && q.config; });
              this.state.quests = list.map(function (q) {
                const rew = q.config.rewards_config && q.config.rewards_config.rewards && q.config.rewards_config.rewards[0];
                return Object.assign({
                  id: q.id,
                  name: nameOf(q),
                  reward: rew && rew.orb_quantity ? rew.orb_quantity + ' orbs' : ((rew && rew.messages && rew.messages.name) || '-'),
                  types: tasksOf(q).map(function (t) { return t.type; }),
                  colors: q.config.colors
                }, progressOf(q));
              });

              try { this.state.orbs = await this.client.orbs(); } catch (e) {}
              this.emit();
              this.log('info', 'Quet xong: ' + this.state.quests.length + ' quest');
            }

            async runOnce() {
              const c = this.getConfig();
              const d = await this.client.myQuests();
              const list = ((d && d.quests) || []).filter(function (q) { return q && q.config; });

              for (const q of list) {
                if (this.stop) break;
                const p = progressOf(q);
                const n = nameOf(q);

                if ((c.exclude || []).indexOf(q.id) > -1) { this.state.stats.skip++; continue; }
                if (c.skipExpired && q.config.expires_at && Date.parse(q.config.expires_at) < Date.now()) continue;
                if (p.claimed) { this.state.stats.skip++; continue; }

                if (p.completed && c.autoClaim) {
                  await this.client.claim(q.id);
                  this.log('ok', n + ': claim quest da xong');
                  continue;
                }

                try {
                  await this.complete(q);
                  this.state.stats.ok++;
                } catch (e) {
                  this.state.stats.fail++;
                  this.log('err', n + ': ' + e.message);
                }
                this.emit();
                await sleep(humanDelay(2000, 6000));
              }
            }

            async complete(q) {
              const c = this.getConfig();
              const n = nameOf(q);
              const tasks = tasksOf(q);
              if (!tasks.length) return;

              if (!(q.user_status && q.user_status.enrolled_at) && c.autoEnroll) {
                await this.client.enroll(q.id);
                this.log('ok', n + ': da nhan quest');
                await sleep(humanDelay(1200, 3200));
              }

              let sk = null;
              if (tasks.some(function (t) { return t.type === 'STREAM_ON_DESKTOP'; })) {
                sk = 'call:' + (await this.client.findVoiceChannel()) + ':1';
              }

              for (const t of tasks) {
                const target = Number(t.target) || 0;
                if (!target) continue;
                const cur0 = (q.user_status && q.user_status.progress && q.user_status.progress[t.type] && q.user_status.progress[t.type].value) || 0;
                if (cur0 >= target) continue;

                if (DUR.has(t.type)) {
                  const steps = progressSteps(target, 6);
                  for (const ts of steps) {
                    await this.client.videoProgress(q.id, ts);
                    this.log('dim', n + ': video ' + ts + '/' + target + 's');
                    await sleep(humanDelay(1800, 4200));
                  }
                } else if (HB.has(t.type)) {
                  let cur = cur0;
                  let guard = 0;
                  while (cur < target && guard++ < 300) {
                    const r = await this.client.heartbeat(q.id, sk || 'call:0:1', false);
                    const got = r && r.progress && r.progress[t.type] && r.progress[t.type].value;
                    cur = (got !== undefined && got !== null) ? got : cur + c.heartbeatSec;
                    this.log('dim', n + ': ' + t.type + ' ' + cur + '/' + target + 's');
                    await sleep(humanDelay(c.heartbeatSec * 850, c.heartbeatSec * 1250));
                  }
                  if (sk) await this.client.heartbeat(q.id, sk, true);
                } else if (ACH.has(t.type)) {
                  await sleep(humanDelay(3000, 6000));
                  await this.client.heartbeat(q.id, 'call:0:1', false);
                }
              }

              if (c.autoClaim) {
                await sleep(humanDelay(2000, 5000));
                const r = await this.client.claim(q.id);
                if (r && r.code) this.log('warn', n + ': ' + (r.message || r.code));
                else this.log('ok', n + ': DA CLAIM');
              }
            }

            async watch() {
              this.running = true;
              this.stop = false;
              this.log('ok', 'Vong lap 24/7 bat');
              while (!this.stop) {
                try {
                  await this.scan();
                  await this.runOnce();
                } catch (e) {
                  this.log('err', 'vong lap: ' + e.message);
                }
                await sleep(this.getConfig().watchIntervalMs);
              }
              this.running = false;
            }

            halt() { this.stop = true; this.log('warn', 'Da dung'); }
          }
          EOF

