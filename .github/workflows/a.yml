          cat > src/discord/api.js <<'EOF'
          // Endpoint theo docs.discord.food/resources/quests (2026)
          const API = 'https://discord.com/api/v9';

          export const ELECTRON = '37.2.0';
          export const CHROME = '138.0.7204.251';
          export const APP = '1.0.9189';
          export const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ' +
                             '(KHTML, like Gecko) discord/' + APP + ' Chrome/' + CHROME +
                             ' Electron/' + ELECTRON + ' Safari/537.36';

          export const LOCATION = 11;   // QUEST_HOME_DESKTOP
          export const PLATFORM = 0;    // CROSS_PLATFORM

          export const ENDPOINTS = {
            me:            { m: 'GET',  p: '/users/@me' },
            userGuilds:    { m: 'GET',  p: '/users/@me/guilds' },
            entitlements:  { m: 'GET',  p: '/users/@me/entitlements' },
            quests:        { m: 'GET',  p: '/quests/@me' },
            claimed:       { m: 'GET',  p: '/quests/@me/claimed' },
            questConfig:   { m: 'GET',  p: '/quests/{id}' },
            decision:      { m: 'GET',  p: '/quests/decision' },
            getDecisions:  { m: 'GET',  p: '/quests/get-decisions' },
            earned:        { m: 'GET',  p: '/quests/earned-decision' },
            enroll:        { m: 'POST', p: '/quests/{id}/enroll' },
            videoProgress: { m: 'POST', p: '/quests/{id}/video-progress' },
            heartbeat:     { m: 'POST', p: '/quests/{id}/heartbeat' },
            claimReward:   { m: 'POST', p: '/quests/{id}/claim-reward' },
            guildChannels: { m: 'GET',  p: '/guilds/{id}/channels' }
          };

          const mem = new Map();
          export const memoryStorage = {
            get: (k) => (mem.has(k) ? mem.get(k) : null),
            set: (k, v) => { mem.set(k, v); }
          };

          export const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          export const rand = (a, b) => a + Math.random() * (b - a);

          export function gauss() {
            let u = 0, v = 0;
            while (!u) u = Math.random();
            while (!v) v = Math.random();
            return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
          }

          export function humanDelay(a, b) {
            const m = (a + b) / 2, s = (b - a) / 6;
            return Math.max(a * 0.5, Math.round(m + gauss() * s));
          }

          export function backoff(base, att, max) {
            const e = Math.min(max, base * Math.pow(2, att));
            return Math.round(e * (0.5 + Math.random() * 0.5));
          }

          export function rid() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
              const r = (Math.random() * 16) | 0;
              return (c === 'x' ? r : ((r & 3) | 8)).toString(16);
            });
          }

          export function shuffle(a) {
            const x = a.slice();
            for (let i = x.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [x[i], x[j]] = [x[j], x[i]];
            }
            return x;
          }

          // ───────── doc payload khoan dung ─────────
          export function asArray(v) {
            if (!v) return [];
            if (Array.isArray(v)) return v;
            if (typeof v === 'object') return Object.values(v);
            return [];
          }

          export function extractQuests(p) {
            if (!p) return [];
            if (Array.isArray(p)) return p;
            for (const k of ['quests', 'Quests', 'quest_list', 'items', 'entries']) {
              const a = asArray(p[k]);
              if (a.length) return a;
            }
            for (const k of Object.keys(p)) {
              const v = p[k];
              if (v && typeof v === 'object' && !Array.isArray(v)) {
                for (const k2 of ['quests', 'items', 'entries', 'data']) {
                  const a = asArray(v[k2]);
                  if (a.length) return a;
                }
              }
            }
            return [];
          }

          // /quests/decision va /quests/get-decisions tra {decisions:[{quest:{...}}]}
          export function questsFromDecisions(p) {
            const out = [];
            if (!p) return out;
            for (const x of asArray(p.decisions || p.quests || p.items)) {
              const q = x && (x.quest || x.quests);
              if (q && q.id) out.push(q);
              else if (x && x.id && (x.config || x.task_config_v2 || x.taskConfigV2)) out.push(x);
            }
            const m = p.quests;
            if (!out.length && m && !Array.isArray(m) && typeof m === 'object') {
              for (const q of Object.values(m)) if (q && q.id) out.push(q);
            }
            return out;
          }

          export function describePayload(p) {
            if (p === null || p === undefined) return 'null';
            if (Array.isArray(p)) return 'array(' + p.length + ')';
            if (typeof p !== 'object') return typeof p;
            const parts = ['keys=' + (Object.keys(p).join(',') || '-')];
            for (const k of ['quests', 'excluded_quests', 'decisions', 'items', 'data']) {
              if (Array.isArray(p[k])) parts.push(k + '=' + p[k].length);
            }
            if (p.quest_access_suspended_until) parts.push('SUSPENDED=' + p.quest_access_suspended_until);
            if (p.quest_enrollment_blocked_until) parts.push('BLOCKED=' + p.quest_enrollment_blocked_until);
            if (p.message) parts.push('msg=' + String(p.message).slice(0, 60));
            if (p._error) parts.push('err=' + p._error);
            return parts.join(' | ');
          }

          export class DiscordClient {
            constructor(opts) {
              this.token = opts.token;
              this.getConfig = opts.getConfig;
              this.storage = opts.storage || memoryStorage;
              this.onLog = opts.onLog || function () {};
              this.build = 0;
              this.buildUsed = 0;
              this.buildSource = '-';
              this.tokens = 60;
              this.last = Date.now();
              this.lastQuestPayload = null;
              // phai ON DINH (tai lieu: client reuse ad session 30 phut)
              this.launchId = rid();
              this.hbSessionId = rid();
              this.adSessionId = rid();
            }

            log(lv, m) { this.onLog(lv, m); }

            async rateAcquire() {
              for (;;) {
                const now = Date.now();
                this.tokens = Math.min(60, this.tokens + (now - this.last) * 0.001);
                this.last = now;
                if (this.tokens >= 1) { this.tokens -= 1; return; }
                await sleep(Math.ceil((1 - this.tokens) * 1000) + 25);
              }
            }

            async buildNumber() {
              if (this.build) return this.build;

              const forced = Number(this.getConfig().buildNumber) || 0;
              if (forced) { this.buildUsed = forced; this.buildSource = 'override'; return (this.build = forced); }

              const c = await this.storage.get('discordBuild');
              if (c && c.build && Date.now() - c.at < 21600000) {
                this.buildUsed = c.build; this.buildSource = 'cache';
                return (this.build = c.build);
              }

              // GLOBAL_ENV la JSON da escape, key la BUILD_NUMBER
              const pats = [
                /BUILD_NUMBER\\?"?\s*:\s*\\?"?(\d{5,7})/i,
                /"build_?number\\?"?\s*:\s*\\?"?(\d{5,7})/i,
                /assets\/(\d{5,7})\//
              ];

              for (const u of ['https://discord.com/app', 'https://discord.com/login']) {
                try {
                  const h = await (await fetch(u, { headers: { 'User-Agent': UA } })).text();
                  for (const p of pats) {
                    const m = h.match(p);
                    if (m && Number(m[1]) > 100000) {
                      const b = Number(m[1]);
                      await this.storage.set('discordBuild', { build: b, at: Date.now() });
                      this.buildUsed = b; this.buildSource = 'web';
                      return (this.build = b);
                    }
                  }
                } catch (e) {}
              }

              this.buildUsed = 350000; this.buildSource = 'fallback';
              return (this.build = 350000);
            }

            // dung chung cho ca REST header va IDENTIFY cua gateway
            async clientProperties() {
              const b = await this.buildNumber();
              return {
                os: 'Windows',
                browser: 'Discord Client',
                device: '',
                system_locale: 'en-US',
                browser_user_agent: UA,
                browser_version: ELECTRON,
                os_version: '10.0.22631',
                client_version: APP,
                referrer: '',
                referring_domain: '',
                release_channel: 'stable',
                client_build_number: b,
                client_event_source: null,
                client_launch_id: this.launchId,
                client_heartbeat_session_id: this.hbSessionId,
                client_app_state: 'focused'
              };
            }

            async headers() {
              const sp = Buffer.from(JSON.stringify(await this.clientProperties())).toString('base64');
              return {
                Authorization: this.token,
                'User-Agent': UA,
                Accept: '*/*',
                'Accept-Language': 'en-US,en;q=0.9',
                'X-Super-Properties': sp,
                'X-Discord-Locale': 'en-US',
                'X-Discord-Timezone': 'Asia/Bangkok',
                'X-Debug-Options': 'bugReporterEnabled',
                'Sec-Fetch-Dest': 'empty',
                'Sec-Fetch-Mode': 'cors',
                'Sec-Fetch-Site': 'same-origin',
                Origin: 'https://discord.com',
                Referer: 'https://discord.com/channels/@me'
              };
            }

            async raw(method, path, body) {
              const url = /^https?:/.test(path) ? path : API + path;
              await this.rateAcquire();
              try {
                const r = await fetch(url, {
                  method: method,
                  headers: await this.headers(),
                  body: body ? JSON.stringify(body) : undefined
                });
                const t = await r.text();
                let data = {};
                try { data = t ? JSON.parse(t) : {}; } catch (e) { data = { _text: t.slice(0, 400) }; }
                return { status: r.status, data: data };
              } catch (e) {
                return { status: 0, data: { _error: e.message } };
              }
            }

            probe(path) { return this.raw('GET', path); }

            async call(key, o) {
              o = o || {};
              const ep = ENDPOINTS[key];
              let url = API + ep.p;
              for (const k of Object.keys(o.params || {})) url = url.replace('{' + k + '}', o.params[k]);
              if (o.query) url += '?' + new URLSearchParams(o.query);
              const label = o.label || key;
              const c = this.getConfig();
              let lastPayload = null;

              for (let a = 0; a <= c.maxRetries; a++) {
                if (a === 0 && !o.noDelay) await sleep(humanDelay(c.minDelayMs, c.maxDelayMs));
                await this.rateAcquire();
                try {
                  const r = await fetch(url, {
                    method: ep.m,
                    headers: await this.headers(),
                    body: o.body ? JSON.stringify(o.body) : undefined
                  });
                  if (r.ok) {
                    const t = await r.text();
                    return t ? JSON.parse(t) : {};
                  }
                  const p = await r.json().catch(function () { return {}; });
                  lastPayload = p;

                  if (r.status === 429) {
                    const w = (p.retry_after !== undefined ? p.retry_after : 2) * 1000;
                    this.log('warn', label + ': 429 -> nghi ' + Math.round(w) + 'ms');
                    await sleep(w + rand(100, 500));
                    continue;
                  }
                  if (r.status === 401) { this.log('err', label + ': 401 - token sai hoac UA thieu Electron'); return p; }
                  if (r.status === 403) { this.log('warn', label + ': 403 - can OAuth/telemetry that'); return p; }
                  if (r.status === 404) return p;
                  if (a >= c.maxRetries) return p;

                  const w = backoff(c.backoffBaseMs, a, c.backoffMaxMs);
                  this.log('dim', label + ': ' + r.status + ' -> backoff ' + w + 'ms');
                  await sleep(w);
                } catch (e) {
                  this.log('warn', label + ': loi mang -> thu lai');
                  if (a >= c.maxRetries) throw e;
                  await sleep(backoff(c.backoffBaseMs, a, c.backoffMaxMs));
                }
              }
              return lastPayload || {};
            }

            me() { return this.call('me', { label: 'me' }); }

            async questsInfo() {
              const r = await this.raw('GET', '/quests/@me');
              const d = r.data || {};
              return {
                status: r.status, url: '/quests/@me',
                quests: extractQuests(d),
                excluded: Array.isArray(d.excluded_quests) ? d.excluded_quests : [],
                blockedUntil: d.quest_enrollment_blocked_until || null,
                suspendedUntil: d.quest_access_suspended_until || null,
                keys: Object.keys(d), raw: d
              };
            }

            // gom quest tu NHIEU nguon, merge theo id, uu tien ban co user_status
            async myQuests(depth) {
              depth = depth || 0;

              const sources = [
                { path: '/quests/@me', label: 'GET /quests/@me', pick: extractQuests },
                { path: '/quests/get-decisions?placement=11&num_decisions_requested=15', label: 'GET /quests/get-decisions?placement=11', pick: questsFromDecisions },
                { path: '/quests/decision?placement=11', label: 'GET /quests/decision?placement=11', pick: questsFromDecisions },
                { path: '/quests/@me?with_application=true', label: 'GET /quests/@me?with_application', pick: extractQuests }
              ];

              const byId = new Map();
              let main = null, last = null, retried = false;

              for (const s of sources) {
                const r = await this.raw('GET', s.path);
                r.label = s.label; r.url = s.path;

                let found = [];
                try { found = s.pick(r.data) || []; } catch (e) { found = []; }
                r.count = found.length;

                this.log('dim', s.label + ' -> HTTP ' + r.status + ' | ' + describePayload(r.data) + ' | found=' + r.count);

                if (r.status === 429 && !retried) {
                  retried = true;
                  const w = (r.data.retry_after || 5) * 1000;
                  this.log('warn', '429 -> nghi ' + Math.round(w) + 'ms roi thu lai');
                  await sleep(w + 400);
                  return this.myQuests(depth + 1);
                }
                if (r.status !== 200) { last = r; await sleep(rand(400, 800)); continue; }
                if (!main) main = r;

                for (const q of found) {
                  if (!q || !q.id) continue;
                  const prev = byId.get(q.id);
                  if (!prev) { byId.set(q.id, q); continue; }
                  if (!prev.user_status && q.user_status) byId.set(q.id, q);
                }

                if (byId.size && s.path === '/quests/@me') break;
                await sleep(byId.size ? rand(700, 1200) : rand(400, 800));
              }

              const out = main || last || { status: 0, data: {}, url: '-', label: '-' };
              out.data = Object.assign({}, (main && main.data) || {}, { quests: Array.from(byId.values()) });
              out.count = byId.size;
              out.fromDecisions = byId.size > 0 && !(main && main.data && Array.isArray(main.data.quests) && main.data.quests.length);
              this.lastQuestPayload = out;
              return out;
            }

            enroll(id) {
              return this.call('enroll', { params: { id: id }, body: { location: LOCATION }, label: 'enroll' });
            }

            videoProgress(id, ts) {
              const t = Math.max(1, Math.round(ts));
              return this.call('videoProgress', { params: { id: id }, body: { timestamp: t }, noDelay: true, label: 'video ' + t + 's' });
            }

            heartbeat(id, streamKey, terminal, appId) {
              const body = {};
              if (streamKey) body.stream_key = streamKey;
              if (appId) body.application_id = appId;
              if (terminal) body.terminal = true;
              return this.call('heartbeat', { params: { id: id }, body: body, noDelay: true, label: 'heartbeat' });
            }

            claim(id) {
              return this.call('claimReward', { params: { id: id }, body: { location: LOCATION, platform: PLATFORM }, label: 'claim' });
            }

            entitlements() { return this.call('entitlements', { query: { exclude_consumed: true }, label: 'entitlements' }); }
            guilds() { return this.call('userGuilds', { label: 'guilds' }); }
            channels(g) { return this.call('guildChannels', { params: { id: g }, label: 'channels' }); }

            async orbs() {
              const l = await this.entitlements();
              const arr = Array.isArray(l) ? l : ((l && l.entitlements) || []);
              return arr
                .filter(function (e) { return String(e.application_id) === '1004729762109481020' || e.sku_id; })
                .reduce(function (s, e) { return s + (e.quantity || 1); }, 0);
            }

