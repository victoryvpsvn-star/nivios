          const val = function (f) {
            const i = args.indexOf(f);
            return i > -1 ? args[i + 1] : null;
          };
          const C = { info: '\x1b[36m', ok: '\x1b[32m', warn: '\x1b[33m', err: '\x1b[31m', dim: '\x1b[90m' };
          const log = function (lv, m) {
            console.log((C[lv] || '') + '[' + new Date().toLocaleTimeString('vi-VN') + '] ' + m + '\x1b[0m');
          };

          main().catch(function (e) { console.error(e); process.exit(1); });

          async function main() {
            if (val('--token')) save({ token: String(val('--token')).trim() });
            if (val('--port')) save({ port: Number(val('--port')) });

            const token = (cfg().token || process.env.DISCORD_TOKEN || '').trim();
            const engine = new Engine({
              token: token,
              getConfig: cfg,
              onLog: log,
              storage: nodeStorage
            });

            console.log('');
            console.log('   ==============================================');
            console.log('    Discord Quests Auto   v' + VERSION);
            console.log('    Anti rate-limit - chay 24/7');
            console.log('    Du lieu: ' + DATA_DIR);
            console.log('   ==============================================');
            console.log('');

            if (has('--once')) {
              if (!token) { console.error('Thieu token'); process.exit(1); }
              try { await engine.scan(); } catch (e) { log('err', 'scan: ' + e.message); }
              try { await engine.runOnce(); } catch (e) { log('err', 'run: ' + e.message); }
              log('ok', 'Xong. ok=' + engine.state.stats.ok + ' fail=' + engine.state.stats.fail);
              process.exit(0);
            }

            if (has('--watch') && !has('--server')) {
              if (!token) { console.error('Thieu token'); process.exit(1); }
              await engine.scan();
              await engine.watch();
              return;
            }

            startServer(engine, { open: !has('--no-open') });

            if (token) {
              try { await engine.scan(); } catch (e) { log('err', e.message); }
              engine.watch().catch(function (e) { log('err', e.message); });
            } else {
              log('warn', 'Chua co token - dan vao web roi bam Luu token.');
            }
          }
          EOF

      # ══════════════ 4. build.mjs ══════════════
      - name: Tạo build.mjs
        shell: bash
        run: |
          cat > build.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import { execSync } from 'node:child_process';
          import * as esbuild from 'esbuild';

          const root = process.cwd();
          const pkg = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8'));
          const work = path.join(root, 'out', '.build');
          const outDir = path.join(root, 'out');

          fs.rmSync(work, { recursive: true, force: true });
          fs.mkdirSync(work, { recursive: true });
          fs.mkdirSync(outDir, { recursive: true });

          const isWin = process.platform === 'win32';
          const bundle = path.join(work, 'bundle.cjs');
          const blob = path.join(work, 'sea-prep.blob');
          const exe = path.join(outDir, isWin
            ? 'DiscordQuestsAuto-v' + pkg.version + '.exe'
            : 'DiscordQuestsAuto-v' + pkg.version + '-' + process.platform + '-' + process.arch);

          console.log('[1/5] Bundle code + index.html...');
          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');

          await esbuild.build({
            entryPoints: [path.join(root, 'src', 'cli.js')],
            bundle: true,
            platform: 'node',
            target: 'node20',
            format: 'cjs',
            outfile: bundle,
            minify: true,
            legalComments: 'none',
            loader: { '.html': 'text' },
            define: {
              __INDEX_HTML__: JSON.stringify(html),
              __BUILD_VERSION__: JSON.stringify(pkg.version)
            }
          });

          console.log('[2/5] SEA config...');
          fs.writeFileSync(path.join(work, 'sea-config.json'), JSON.stringify({
            main: bundle,
            output: blob,
            disableExperimentalSEAWarning: true,
            useSnapshot: false,
            useCodeCache: false
          }, null, 2));
          execSync('node --experimental-sea-config sea-config.json', { cwd: work, stdio: 'inherit' });

          console.log('[3/5] Copy runtime Node...');
          fs.copyFileSync(process.execPath, exe);

          console.log('[4/5] Go chu ky...');
          if (isWin) {
            try {
              execSync('signtool remove /s "' + exe + '"', { stdio: 'ignore' });
              console.log('   da go');
            } catch (e) {
              console.log('   bo qua (khong co signtool)');
            }
          } else {
            try { execSync('codesign --remove-signature "' + exe + '"', { stdio: 'ignore' }); } catch (e) {}
          }

          console.log('[5/5] Inject blob...');
          execSync(
            'npx --yes postject "' + exe + '" NODE_SEA_BLOB "' + blob +
            '" --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2',
            { stdio: 'inherit' }
          );

          fs.rmSync(work, { recursive: true, force: true });
          console.log('');
          console.log('OK: ' + path.basename(exe) + '  (' + (fs.statSync(exe).size / 1048576).toFixed(1) + ' MB)');
          EOF

      # ══════════════ 5. BUILD ══════════════
      - name: Cài esbuild
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Build exe
        shell: bash
        run: node build.mjs

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = Get-ChildItem out\*.exe | Select-Object -First 1
          "=== $($exe.Name) - $([math]::Round($exe.Length/1MB,1)) MB ===" | Tee-Object -Append summary.txt
          $p = Start-Process $exe.FullName -ArgumentList '--once','--no-open','--port','3099' `
                -PassThru -RedirectStandardOutput run.txt -RedirectStandardError err.txt
          Start-Sleep -Seconds 35
          if (-not $p.HasExited) { $p.Kill() }
          Get-Content run.txt,err.txt -ErrorAction SilentlyContinue | Tee-Object -Append summary.txt
          (Get-FileHash $exe.FullName -Algorithm SHA256).Hash | Tee-Object -Append summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DiscordQuestsAuto-exe
          path: |
            out/*.exe
            summary.txt
          retention-days: 90

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          generate_release_notes: true
