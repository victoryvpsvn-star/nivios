name: Build EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        default: '3.1.0'
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ inputs.version || '3.1.0' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ══════════════ 1. package.json ══════════════
      - name: Tạo package.json
        shell: bash
        run: |
          cat > package.json <<EOF
          {
            "name": "discord-quests-auto",
            "version": "${VERSION}",
            "private": true,
            "type": "module",
            "scripts": { "build": "node build.mjs" },
            "devDependencies": { "esbuild": "^0.24.0" }
          }
          EOF

      # ══════════════ 2. index.html ══════════════
      - name: Tạo index.html
        shell: bash
        run: |
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="vi"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Discord Quests Auto</title>
          <style>
          :root{--b:#5865F2;--f:#EB459E;--g:#57F287;--y:#FEE75C;--r:#ED4245;--bg:#0E0F13;--bg3:#25262C;--m:#6D7080;--t:#C8CAD0}
          *{margin:0;padding:0;box-sizing:border-box}
          html,body{background:var(--bg);color:var(--t);font-family:'Segoe UI',system-ui,sans-serif;min-height:100dvh;overflow-x:hidden}
          .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
          .aur{position:absolute;border-radius:50%;filter:blur(90px);opacity:0;animation:ain 2s .2s ease forwards}
          .a1{width:60vmax;height:60vmax;top:-26vmax;left:-16vmax;background:radial-gradient(circle,rgba(88,101,242,.28),transparent 65%);animation:ain 2s .2s ease forwards,af1 26s ease-in-out infinite alternate}
          .a2{width:52vmax;height:52vmax;bottom:-22vmax;right:-12vmax;background:radial-gradient(circle,rgba(235,69,158,.22),transparent 65%);animation:ain 2.4s .45s ease forwards,af2 32s ease-in-out infinite alternate}
          .a3{width:42vmax;height:42vmax;top:32%;left:42%;background:radial-gradient(circle,rgba(87,242,135,.11),transparent 65%);animation:ain 2.8s .7s ease forwards}
          @keyframes ain{to{opacity:1}}
          @keyframes af1{to{transform:translate(6vmax,4vmax) scale(1.15)}}
          @keyframes af2{to{transform:translate(-5vmax,-4vmax) scale(1.2)}}
          .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(88,101,242,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(88,101,242,.035) 1px,transparent 1px);background-size:60px 60px}
          #pc{position:fixed;inset:0;z-index:1;pointer-events:none}
          .wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:22px 18px 60px}
          #boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:var(--bg);transition:opacity .7s,transform .7s}
          #boot.out{opacity:0;pointer-events:none;transform:scale(1.04)}
          .logo{position:relative;width:106px;height:106px}
          .ring{position:absolute;border-radius:50%;background:conic-gradient(from 0deg,transparent 30%,var(--b) 68%,var(--f) 88%,transparent);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:spin 1.4s linear infinite}
          .r1{inset:-14px}
          .r2{inset:-30px;animation:spin 2.4s linear infinite reverse}
          .core{position:absolute;inset:0;border-radius:24px;background:linear-gradient(135deg,var(--b),var(--f));display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(88,101,242,.5)}
          .core svg{width:58px;height:58px;fill:#fff}
          @keyframes spin{to{transform:rotate(360deg)}}
          .ttl{font-size:29px;font-weight:700;color:#fff;text-align:center}
          .ttl i{font-style:normal;display:inline-block;opacity:0;animation:ch .5s cubic-bezier(.25,1.2,.35,1) forwards}
          @keyframes ch{from{opacity:0;transform:translateY(22px) rotate(5deg) scale(.75)}to{opacity:1;transform:none}}
          .ttl .g{background:linear-gradient(135deg,var(--b),var(--f));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
          .st{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--m);text-align:center}
          .pbar{width:280px;max-width:78vw;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
          .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--f));animation:grow 2.1s cubic-bezier(.4,0,.2,1) forwards}
          @keyframes grow{to{width:100%}}
          #login{display:none;min-height:100dvh;align-items:center;justify-content:center;position:relative;z-index:2}
          .card{background:rgba(30,31,38,.62);border:1px solid rgba(88,101,242,.14);border-radius:20px;padding:30px;backdrop-filter:blur(20px);width:min(430px,92vw);text-align:center}
          .card h1{font-size:19px;color:#fff;font-weight:600;margin-bottom:6px}
          .card p{font-size:12.5px;color:var(--m);line-height:1.6;margin-bottom:18px}
          input,select{width:100%;padding:12px 14px;border-radius:11px;border:1px solid rgba(88,101,242,.16);background:rgba(14,15,19,.75);color:var(--t);font-size:13px;outline:none}
          input:focus,select:focus{border-color:rgba(88,101,242,.6)}
          .btn{padding:11px 18px;border-radius:11px;border:0;background:linear-gradient(135deg,var(--b),#4752C4);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
          .btn:hover{filter:brightness(1.12)}
          .btn:disabled{opacity:.55;cursor:default}
          .btn.full{width:100%;margin-top:12px}
          .btn.gh{background:rgba(88,101,242,.12);border:1px solid rgba(88,101,242,.32);color:#aab3ff}
          .btn.sm{padding:7px 13px;font-size:11.5px}
          .hint{font-size:11px;color:var(--m);margin-top:14px;line-height:1.7}
          .err{color:var(--r);font-size:12px;margin-top:10px;min-height:16px}
          #app{display:none}
          .top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
          .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--f));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600}
          .top h2{font-size:15px;color:#fff;font-weight:600}
          .top .s{font-size:10.5px;color:var(--m);letter-spacing:1.4px;text-transform:uppercase}
          .tags{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
          .tag{padding:5px 12px;border-radius:20px;font-size:10.5px;font-weight:600;background:rgba(30,31,38,.62);border:1px solid rgba(88,101,242,.14);color:var(--m)}
          .tag.on{color:var(--g);border-color:rgba(87,242,135,.4)}
          .tag.orb{color:var(--y);border-color:rgba(254,231,92,.35)}
          .tag.bad{color:var(--r);border-color:rgba(237,66,69,.4)}
          .banner{display:none;margin-bottom:14px;padding:11px 14px;border-radius:12px;font-size:12px;line-height:1.6;background:rgba(237,66,69,.1);border:1px solid rgba(237,66,69,.35);color:#ffb3b5}
          .banner.show{display:block}
          .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
          .stt{background:rgba(30,31,38,.62);border:1px solid rgba(88,101,242,.14);border-radius:14px;padding:14px}
          .stt b{display:block;font-size:24px;color:#fff}
          .stt span{font-size:10.5px;color:var(--m);text-transform:uppercase}
          .bar2{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
          .tabs{display:flex;gap:7px;margin-bottom:14px;border-bottom:1px solid rgba(88,101,242,.14);padding-bottom:10px;flex-wrap:wrap}
          .tb{padding:6px 14px;border-radius:9px;font-size:12px;color:var(--m);cursor:pointer}
          .tb.on{background:rgba(88,101,242,.16);color:#aab3ff;border:1px solid rgba(88,101,242,.32)}
          .ql{display:grid;gap:10px}
          .qc{display:flex;gap:13px;align-items:center;background:rgba(30,31,38,.62);border:1px solid rgba(88,101,242,.14);border-radius:14px;padding:13px}
          .qi{width:46px;height:46px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
          .qn{font-size:13.5px;color:#fff;font-weight:600}
          .qm{font-size:11px;color:var(--m)}
          .tt{display:inline-block;font-size:9.5px;padding:2px 8px;border-radius:6px;background:rgba(88,101,242,.16);color:#8b95ff;margin-right:5px;font-weight:600}
          .tt.hard{background:rgba(237,66,69,.16);color:#ff9a9c}
          .pg{height:4px;background:var(--bg3);border-radius:2px;margin-top:8px;overflow:hidden}
          .pg i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--f))}
          .log{margin-top:16px;background:rgba(14,15,19,.82);border:1px solid rgba(88,101,242,.14);border-radius:14px;padding:13px;font-family:ui-monospace,monospace;font-size:11px;line-height:1.85;max-height:230px;overflow-y:auto}
          .ok{color:var(--g)}.wr{color:var(--y)}.er{color:var(--r)}.di{color:var(--m)}
          .panel{display:none;background:rgba(30,31,38,.62);border:1px solid rgba(88,101,242,.14);border-radius:16px;padding:18px}
          .panel.on{display:block}
          .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
          label{display:block;font-size:11px;color:var(--m);margin-bottom:6px}
          @media(max-width:640px){.frow{grid-template-columns:1fr}.ttl{font-size:23px}}
          </style></head><body>
          <div class="bg"><div class="aur a1"></div><div class="aur a2"></div><div class="aur a3"></div><div class="grid"></div></div>
          <canvas id="pc"></canvas>

          <div id="boot">
            <div class="logo"><div class="ring r2"></div><div class="ring r1"></div>
              <div class="core"><svg viewBox="0 0 24 24"><path d="M19.27 5.33C17.94 4.71 16.5 4.26 15 4a.09.09 0 0 0-.07.03c-.18.33-.39.76-.53 1.09a16.09 16.09 0 0 0-4.8 0c-.14-.34-.35-.76-.54-1.09-.01-.02-.04-.03-.07-.03-1.5.26-2.93.71-4.27 1.33l-.03.02c-2.72 4.07-3.47 8.03-3.1 11.95 0 .02.01.04.03.05 1.8 1.32 3.53 2.12 5.24 2.65.03.01.06 0 .07-.02.4-.55.76-1.13 1.07-1.74.02-.04 0-.08-.04-.09-.57-.22-1.11-.48-1.64-.78-.04-.02-.04-.08-.01-.11.11-.08.22-.17.33-.25.02-.02.05-.02.07-.01 3.44 1.57 7.15 1.57 10.55 0 .02-.01.05-.01.07.01.11.09.22.17.33.26.04.03.04.09-.01.11-.52.31-1.07.56-1.64.78-.04.01-.05.06-.04.09.32.61.68 1.19 1.07 1.74.03.01.06.02.09.01 1.72-.53 3.45-1.33 5.25-2.65.02-.01.03-.03.03-.05.44-4.53-.73-8.46-3.1-11.95-.01-.01-.02-.02-.04-.02zM8.52 14.91c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12 0 1.17-.84 2.12-1.89 2.12zm6.97 0c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12 0 1.17-.83 2.12-1.89 2.12z"/></svg></div>
            </div>
            <div><div class="ttl" id="ttl"></div><div class="st" style="margin-top:6px">Discord Quests Auto</div></div>
            <div class="pbar"><i></i></div>
            <div class="st" id="bmsg" style="letter-spacing:0;text-transform:none;font-size:12.5px">Đang khởi chạy...</div>
          </div>

          <div id="login">
            <div class="card">
              <h1>Tự động hoàn thành Discord Quests</h1>
              <p>Nhập Discord User Token. Tool chạy ngầm trên máy bạn, đóng tab vẫn farm.</p>
              <input id="tk" type="password" placeholder="Dán Discord User Token" autocomplete="off">
              <button class="btn full" id="go">Đăng nhập</button>
              <div class="err" id="err"></div>
              <div class="hint">Lấy token: Discord → <b>Ctrl+Shift+I</b> → tab Network → F5 → chọn request bất kỳ → copy header <b>authorization</b>.</div>
            </div>
          </div>

          <div id="app" class="wrap">
            <div class="top">
              <div class="av" id="av">?</div>
              <div><h2 id="un">...</h2><div class="s">Discord Quests Auto</div></div>
              <div class="tags">
                <span class="tag orb" id="orb">0 orbs</span>
                <span class="tag" id="run">ĐÃ DỪNG</span>
                <button class="btn sm gh" id="out">Đổi token</button>
              </div>
            </div>
            <div class="banner" id="ban"></div>
            <div class="stats">
              <div class="stt"><b id="s1">0</b><span>Quest đang mở</span></div>
              <div class="stt"><b id="s2" style="color:var(--g)">0</b><span>Đã claim</span></div>
              <div class="stt"><b id="s3" style="color:var(--y)">0</b><span>Sẵn sàng claim</span></div>
              <div class="stt"><b id="s4">0</b><span>Orbs</span></div>
            </div>
            <div class="bar2">
              <button class="btn" id="start">Bắt đầu farm</button>
              <button class="btn gh" id="stop">Dừng</button>
              <button class="btn gh" id="scan">Quét lại</button>
              <button class="btn gh" id="once">Chạy 1 vòng</button>
            </div>
            <div class="tabs">
              <span class="tb on" data-t="q">Nhiệm vụ</span>
              <span class="tb" data-t="s">Cài đặt &amp; Anti-ban</span>
            </div>
            <div id="tab-q"><div class="ql" id="list"></div></div>
            <div class="panel" id="tab-s">
              <div class="frow">
                <div><label>Delay min (ms)</label><input id="cMin" type="number"></div>
                <div><label>Delay max (ms)</label><input id="cMax" type="number"></div>
                <div><label>Nhịp heartbeat (giây)</label><input id="cHb" type="number"></div>
                <div><label>Nhịp video (ms)</label><input id="cVid" type="number"></div>
                <div><label>Retry tối đa</label><input id="cRe" type="number"></div>
                <div><label>Chạy song song tối đa</label><input id="cPar" type="number"></div>
                <div><label>Tự nhận quest</label><select id="cEn"><option value="1">Bật</option><option value="0">Tắt</option></select></div>
                <div><label>Tự claim (dễ dính captcha)</label><select id="cCl"><option value="0">Tắt</option><option value="1">Bật</option></select></div>
                <div><label>Bỏ qua STREAM_ON_DESKTOP</label><select id="cSk"><option value="1">Bật</option><option value="0">Tắt</option></select></div>
              </div>
              <label>Bỏ qua quest (ID, cách nhau dấu phẩy)</label>
              <input id="cEx">
              <button class="btn" style="margin-top:14px" id="save">Lưu cài đặt</button>
            </div>
            <div class="log" id="log"></div>
          </div>

          <script>
          var $ = function (s) { return document.querySelector(s); };
          var j = function (u, b) {
            return fetch(u, {
              method: b === undefined ? 'GET' : 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: b === undefined ? undefined : JSON.stringify(b)
            }).then(function (r) { return r.json(); });
          };
          var TOKEN = '';

          (function () {
            var s = 'AutoQuest';
            $('#ttl').innerHTML = s.split('').map(function (c, i) {
              return '<i style="animation-delay:' + (0.7 + i * 0.06) + 's" class="' + (i >= 4 ? 'g' : '') + '">' + c + '</i>';
            }).join('');
            var m = ['Đang khởi chạy hệ thống', 'Đang xác thực dữ liệu', 'Đang tải tài nguyên', 'Đang kết nối Discord'];
            var i = 0;
            var iv = setInterval(function () {
              if (i < m.length) $('#bmsg').textContent = m[i++] + '...';
              else clearInterval(iv);
            }, 600);

            var cv = $('#pc'), cx = cv.getContext('2d');
            function rs() { cv.width = innerWidth; cv.height = innerHeight; }
            rs(); addEventListener('resize', rs);
            var col = [[88,101,242],[235,69,158],[87,242,135],[254,231,92],[255,255,255]];
            var ps = [];
            for (var k = 0; k < 38; k++) ps.push({
              x: Math.random() * innerWidth, y: Math.random() * innerHeight,
              s: Math.random() * 1.8 + 0.5, vx: (Math.random() - 0.5) * 0.18, vy: (Math.random() - 0.5) * 0.18,
              c: col[Math.floor(Math.random() * col.length)], a: Math.random() * 0.35 + 0.1
            });
            (function lp() {
              requestAnimationFrame(lp);
              cx.clearRect(0, 0, cv.width, cv.height);
              for (var n = 0; n < ps.length; n++) {
                var p = ps[n];
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > cv.width) p.vx *= -1;
                if (p.y < 0 || p.y > cv.height) p.vy *= -1;
                cx.beginPath(); cx.arc(p.x, p.y, p.s, 0, 7);
                cx.fillStyle = 'rgba(' + p.c.join(',') + ',' + p.a + ')'; cx.fill();
              }
            })();

            setTimeout(function () {
              $('#boot').classList.add('out');
              setTimeout(function () { $('#boot').style.display = 'none'; boot(); }, 700);
            }, 2400);
          })();

          function log(lv, msg) {
            var d = document.createElement('div');
            d.className = { ok: 'ok', warn: 'wr', err: 'er' }[lv] || 'di';
            d.textContent = '[' + new Date().toLocaleTimeString('vi-VN') + '] ' + msg;
            $('#log').appendChild(d);
            while ($('#log').children.length > 250) $('#log').firstChild.remove();
            $('#log').scrollTop = $('#log').scrollHeight;
          }

          async function boot() {
            var st = await j('/api/state');
            if (st.token) { TOKEN = st.token; show(); }
            else $('#login').style.display = 'flex';
            try {
              new EventSource('/api/logs').onmessage = function (e) {
                var d = JSON.parse(e.data);
                if (d.msg) log(d.lv, d.msg);
              };
            } catch (err) {}
          }

          function show() {
            $('#login').style.display = 'none';
            $('#app').style.display = 'block';
            refresh();
            setInterval(refresh, 3000);
          }

          function refresh() { j('/api/state').then(apply); }

          function apply(st) {
            if (st.me) {
              $('#un').textContent = st.me.global_name || st.me.username;
              $('#av').textContent = (st.me.global_name || st.me.username || '?')[0].toUpperCase();
            }
            $('#orb').textContent = (st.orbs || 0) + ' orbs';
            $('#run').textContent = st.running ? 'ĐANG FARM' : 'ĐÃ DỪNG';
            $('#run').className = 'tag' + (st.running ? ' on' : '');
            $('#s4').textContent = st.orbs || 0;

            var ban = $('#ban');
            if (st.blockedUntil) {
              ban.className = 'banner show';
              ban.textContent = 'Quest bi tam khoa den ' + new Date(st.blockedUntil).toLocaleString('vi-VN') +
                ' (quest_enrollment_blocked_until). Discord van nhan request, chi UI khoa.';
            } else { ban.className = 'banner'; }

            var q = st.quests || [];
            $('#s1').textContent = q.length;
            $('#s2').textContent = q.filter(function (x) { return x.claimed; }).length;
            $('#s3').textContent = q.filter(function (x) { return x.completed && !x.claimed; }).length;

            $('#list').innerHTML = q.map(function (x) {
              var g = 'linear-gradient(135deg,' + (x.colors && x.colors.primary || '#5865F2') + ',' + (x.colors && x.colors.secondary || '#4752C4') + ')';
              var act = '';
              if (x.completed && !x.claimed) act = '<button class="btn sm" data-claim="' + x.id + '">Claim</button>';
              else if (x.claimed) act = '<span class="tag on">ĐÃ CLAIM</span>';
              else if (x.enrolled) act = '<span class="tag" style="color:#8b95ff">ĐANG LÀM</span>';
              else act = '<span class="tag">CHƯA NHẬN</span>';

              var types = (x.types || []).map(function (ty) {
                var hard = (ty === 'STREAM_ON_DESKTOP' || ty === 'ACHIEVEMENT_IN_GAME');
                return '<span class="tt' + (hard ? ' hard' : '') + '">' + ty + '</span>';
              }).join('');

              return '<div class="qc"><div class="qi" style="background:' + g + '">' + x.name.slice(0, 2).toUpperCase() + '</div>' +
                '<div style="flex:1;min-width:0"><div class="qn">' + x.name + '</div>' +
                '<div class="qm">' + types + ' thưởng ' + x.reward + '</div>' +
                '<div class="pg"><i style="width:' + (x.pct || 0) + '%"></i></div></div>' + act + '</div>';
            }).join('') || '<div class="qc"><div class="qm">Chưa có quest nào — bấm Quét lại, hoặc xem /api/debug.</div></div>';

            var c = st.settings || {};
            if (document.activeElement.tagName !== 'INPUT') {
              $('#cMin').value = c.minDelayMs;
              $('#cMax').value = c.maxDelayMs;
              $('#cHb').value = c.heartbeatSec;
              $('#cVid').value = c.videoIntervalMs;
              $('#cRe').value = c.maxRetries;
              $('#cPar').value = c.maxConcurrent;
              $('#cEn').value = c.autoEnroll ? '1' : '0';
              $('#cCl').value = c.autoClaim ? '1' : '0';
              $('#cSk').value = c.skipStream ? '1' : '0';
              $('#cEx').value = (c.exclude || []).join(', ');
            }
          }

          $('#list').onclick = function (e) {
