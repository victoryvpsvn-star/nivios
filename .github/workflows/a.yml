                  : process.platform === 'darwin' ? 'open "' + url + '"' : 'xdg-open "' + url + '"';
                exec(c, function () {});
              }
            });

            process.on('SIGINT', function () { engine.halt(); srv.close(); process.exit(0); });
            return srv;
          }
