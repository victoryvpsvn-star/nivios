          // Endpoint theo docs.discord.food/resources/quests (cap nhat 2026)
          const API = 'https://discord.com/api/v9';

          const ELECTRON = '37.2.0';
          const CHROME = '138.0.7204.251';
          const APP = '1.0.9189';
