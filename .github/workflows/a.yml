          cat > src/core/engine.js <<'EOF'
          import { DiscordClient, sleep, humanDelay, extractQuests, describePayload } from '../discord/api.js';

          const VIDEO = new Set(['WATCH_VIDEO', 'WATCH_VIDEO_ON_MOBILE']);
          const ACTIVITY = new Set(['PLAY_ON_DESKTOP', 'PLAY_ON_DESKTOP_V2', 'STREAM_ON_DESKTOP', 'PLAY_ACTIVITY']);
          const ACHIEVEMENT = new Set(['ACHIEVEMENT_IN_GAME', 'ACHIEVEMENT_IN_ACTIVITY']);
          const REWARD_TYPE = { 1: 'code', 2: 'in-game', 3: 'collectible', 4: 'orbs', 5: 'nitro' };

          // task_config_v2.tasks la map keyed by TYPE (theo spec) - van doc ca cac bien the cu
          function taskConfig(q) {
            const cfg = (q && q.config) || {};
            return cfg.task_config_v2 || cfg.taskConfigV2 || cfg.task_config || cfg.taskConfig || {};
          }

          function tasksOf(q) {
            const tc = taskConfig(q);
            const tasks = tc.tasks || tc;
            return Object.values(tasks || {}).filter(function (t) { return t && t.type; });
          }

          function appIdOf(t) {
            const a = (t && t.applications) || [];
            return (a[0] && a[0].id) || null;
          }

          function nameOf(q) {
            const c = (q && q.config) || {};
            const m = c.messages || {};
            return m.quest_name || m.name
              || (c.application && (c.application.name || c.application.name_localized))
              || (q && q.id) || '?';
          }

          function rewardOf(q) {
            const c = (q && q.config) || {};
            const rc = c.rewards_config || c.rewardsConfig || {};
            const rew = (rc.rewards || [])[0];
            if (!rew) return '-';
            if (rew.orb_quantity) return rew.orb_quantity + ' orbs';
            if (rew.messages && rew.messages.name) return rew.messages.name;
            return REWARD_TYPE[rew.type] || ('type ' + rew.type);
          }

          function normalize(item) {
            if (!item || typeof item !== 'object') return null;
            const q = item.quest || item;
            const cfg = q.config || q.config_v2 || q;
            const us = q.user_status || q.userStatus || item.user_status || item.userStatus || {};
            const id = q.id || cfg.id || item.id;
            if (!id) return null;
            return { id: String(id), config: cfg, user_status: us };
          }

          function progValue(us, type) {
            const p = us && us.progress;
            if (!p) return 0;
            const v = p[type];
            if (v === undefined || v === null) return 0;
            if (typeof v === 'number') return v;
            return Number(v.value || 0);
          }

          export function progressOf(q) {
            const us = (q && q.user_status) || {};
            let cur = 0, tgt = 0;
            for (const t of tasksOf(q)) {
              cur += progValue(us, t.type);
              tgt += Number(t.target || 0);
            }
            if (!tgt) tgt = 1;
            return {
              enrolled: !!us.enrolled_at,
              completed: !!us.completed_at,
              claimed: !!us.claimed_at,
              pct: Math.min(100, Math.round((cur / tgt) * 100))
            };
          }

          export class Engine {
            constructor(opts) {
              this.getConfig = opts.getConfig;
              this.log = opts.onLog || function () {};
              this.onState = opts.onState || function () {};
              this.client = new DiscordClient({
                token: opts.token,
                getConfig: opts.getConfig,
                onLog: this.log,
                storage: opts.storage
              });
              this.stop = false;
              this.running = false;
              this.state = { me: null, orbs: 0, quests: [], blockedUntil: null, stats: { ok: 0, fail: 0, skip: 0 }, debug: null };
            }

            emit() { this.onState(this.state); }

            async scan() {
              const me = await this.client.me();
              if (!me || me.code === 401) throw new Error('Token khong hop le (hoac UA thieu Electron)');
              this.state.me = { id: me.id, username: me.username, global_name: me.global_name };

              const res = await this.client.myQuests();
              const items = extractQuests(res.data);
              const list = items.map(normalize).filter(Boolean);

              this.state.blockedUntil = (res.data && res.data.quest_enrollment_blocked_until) || null;

              this.state.debug = {
                at: new Date().toISOString(),
                url: res.url,
                status: res.status,
                keys: Object.keys(res.data || {}),
                items: items.length,
                parsed: list.length,
                sample: items[0] ? Object.keys(items[0]) : [],
                sampleConfig: items[0] && items[0].config ? Object.keys(items[0].config) : [],
                sampleTasks: items[0] ? Object.keys(taskConfig(normalize(items[0]))).slice(0, 10) : []
              };

              this.log('info', 'quests: HTTP ' + res.status + ' | ' + res.label + ' | ' + describePayload(res.data));
              this.log('info', 'item=' + items.length + ' -> parse=' + list.length + ' quest');

              if (res.status === 401) this.log('err', '401: token sai, hoac UA thieu chuoi Electron/x.y.z');
              else if (items.length && !list.length) this.log('warn', 'item co nhung thieu id/config - xem /api/debug');
              else if (!items.length) this.log('warn', 'API tra rong - xem /api/debug');

              if (this.state.blockedUntil) {
                this.log('warn', 'Quest dang bi tam khoa den ' + this.state.blockedUntil);
              }

              this.state.quests = list.map(function (q) {
                return Object.assign({
                  id: q.id,
                  name: nameOf(q),
                  reward: rewardOf(q),
                  types: tasksOf(q).map(function (t) { return t.type; }),
                  colors: q.config.colors
                }, progressOf(q));
              });

              try { this.state.orbs = await this.client.orbs(); } catch (e) {}
              this.emit();
              this.log('info', 'Quet xong: ' + this.state.quests.length + ' quest');
            }

            // ───── video: ton trong gioi han timestamp <= (now - enrolled_at) + lead ─────
            async doVideo(q, t, n) {
              const c = this.getConfig();
              const target = Number(t.target) || 0;
              if (!target) return false;
              const enrolled = Date.parse((q.user_status && q.user_status.enrolled_at) || '') || Date.now();
              const started = Date.now();

              while (!this.stop) {
                const allowed = Math.floor((Date.now() - enrolled) / 1000) + c.videoMaxLeadSec;
                const ts = Math.min(target, Math.max(allowed, 1));
                const r = await this.client.videoProgress(q.id, ts);

                if (r && r.progress && r.progress[t.type] && r.progress[t.type].value >= target) {
                  this.log('ok', n + ': video xong ' + target + 's');
                  return true;
                }
                if (r && r.completed_at) { this.log('ok', n + ': video completed_at'); return true; }

                this.log('dim', n + ': video ' + ts + '/' + target + 's');

                if ((Date.now() - started) / 60000 > c.maxTaskMinutes) {
                  this.log('warn', n + ': video qua ' + c.maxTaskMinutes + ' phut, bo qua');
                  return false;
                }
                await sleep(Math.round(c.videoIntervalMs * (0.85 + Math.random() * 0.3)));
              }
              return false;
            }

            // ───── heartbeat cho PLAY_*/STREAM_*/PLAY_ACTIVITY: 60s/beat, watchdog 90s ─────
            async doHeartbeat(q, t, n) {
              const c = this.getConfig();
              const target = Number(t.target) || 0;
              if (!target) return false;
              const appId = appIdOf(t);
              const started = Date.now();
              let needKey = (t.type === 'PLAY_ACTIVITY' || t.type === 'STREAM_ON_DESKTOP');
              let key = needKey ? 'call:' + (await this.client.findVoiceChannel()) + ':1' : null;
              let fails = 0;

              while (!this.stop) {
                const r = await this.client.heartbeat(q.id, key, false, appId);
                const v = r && r.progress && r.progress[t.type] && r.progress[t.type].value;

                if (typeof v === 'number') { fails = 0; this.log('dim', n + ': ' + t.type + ' ' + v + '/' + target + 's'); }
                else { fails++; this.log('dim', n + ': ' + t.type + ' beat fail (' + fails + '/' + c.heartbeatMaxFails + ')'); }

                if (typeof v === 'number' && v >= target) {
                  if (key || appId) await this.client.heartbeat(q.id, key, true, appId);
                  this.log('ok', n + ': ' + t.type + ' xong');
                  return true;
                }
                if (fails >= c.heartbeatMaxFails) { this.log('warn', n + ': ' + t.type + ' fail lien tuc, bo qua'); return false; }
                if ((Date.now() - started) / 60000 > c.maxTaskMinutes) { this.log('warn', n + ': ' + t.type + ' qua han'); return false; }

                await sleep(Math.round(c.heartbeatSec * 1000 * (0.9 + Math.random() * 0.2)));
              }
              return false;
            }

            async doAchievement(q, t, n) {
              const appId = appIdOf(t);
              const r = await this.client.heartbeat(q.id, null, false, appId);
              if (r && r.code === 403) {
                this.log('warn', n + ': ' + t.type + ' can OAuth that (403) - xem README Orion');
                return false;
              }
              this.log('ok', n + ': da ban heartbeat cho ' + t.type);
              return true;
            }

            async complete(q) {
              const c = this.getConfig();
              const n = nameOf(q);
              const tasks = tasksOf(q);
              if (!tasks.length) { this.log('warn', n + ': khong doc duoc task nao'); return; }

              if (!q.user_status.enrolled_at && c.autoEnroll) {
                const r = await this.client.enroll(q.id);
                if (r && r.code) this.log('warn', n + ': enroll ' + (r.message || r.code));
                else {
                  this.log('ok', n + ': da nhan quest');
                  q.user_status.enrolled_at = new Date().toISOString();
                }
                await sleep(humanDelay(1200, 2600));
              }

              for (const t of tasks) {
                if (this.stop) return;
                if (progValue(q.user_status, t.type) >= Number(t.target || 0)) continue;

                if (VIDEO.has(t.type)) await this.doVideo(q, t, n);
                else if (ACTIVITY.has(t.type)) {
                  if (t.type === 'STREAM_ON_DESKTOP' && c.skipStream) {
                    this.log('warn', n + ': STREAM_ON_DESKTOP can Go Live + nguoi thu 2 - bo qua');
                    continue;
                  }
                  await this.doHeartbeat(q, t, n);
                }
                else if (ACHIEVEMENT.has(t.type)) await this.doAchievement(q, t, n);
                else this.log('warn', n + ': task ' + t.type + ' chua ho tro');
              }
            }

            async runOnce() {
              const c = this.getConfig();
              const res = await this.client.myQuests();
              const list = extractQuests(res.data).map(normalize).filter(Boolean);

              const todo = list.filter((q) => {
                if (this.stop) return false;
                if ((c.exclude || []).indexOf(q.id) > -1) { this.state.stats.skip++; return false; }
                if (c.skipExpired && q.config.expires_at && Date.parse(q.config.expires_at) < Date.now()) return false;
                const p = progressOf(q);
                if (p.claimed) { this.state.stats.skip++; return false; }
                if (p.completed) return false;
                return true;
              });

              let idx = 0;
              const workers = Array.from({ length: Math.max(1, Math.min(c.maxConcurrent, todo.length)) }, async () => {
                while (idx < todo.length && !this.stop) {
                  const q = todo[idx++];
                  try {
                    await this.complete(q);
                    this.state.stats.ok++;
                  } catch (e) {
                    this.state.stats.fail++;
                    this.log('err', nameOf(q) + ': ' + e.message);
                  }
                  this.emit();
                  await sleep(humanDelay(1500, 3500));
                }
              });
              await Promise.all(workers);

              if (c.autoClaim) await this.claimReady(list);
            }

            async claimReady(list) {
              for (const q of (list || [])) {
                if (this.stop) break;
                const p = progressOf(q);
                if (p.completed && !p.claimed) {
                  const r = await this.client.claim(q.id);
                  if (r && r.errors && r.errors.length) this.log('warn', nameOf(q) + ': claim ' + JSON.stringify(r.errors[0]));
                  else if (r && r.code) this.log('warn', nameOf(q) + ': claim ' + (r.message || r.code));
                  else this.log('ok', nameOf(q) + ': DA CLAIM');
                }
              }
            }

            async watch() {
              this.running = true;
              this.stop = false;
              this.log('ok', 'Vong lap 24/7 bat');
              while (!this.stop) {
                try {
                  await this.scan();
                  await this.runOnce();
                } catch (e) {
                  this.log('err', 'vong lap: ' + e.message);
                }
                await sleep(this.getConfig().watchIntervalMs);
              }
              this.running = false;
            }

            halt() { this.stop = true; this.log('warn', 'Da dung'); }
          }
          EOF

          cat > src/ui.js <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';

          const INLINE = typeof __INDEX_HTML__ === 'string' ? __INDEX_HTML__ : null;
          let cache = null;

          export function uiHtml() {
            if (cache) return cache;
            if (INLINE) return (cache = INLINE);
            const cands = [
              path.join(process.cwd(), 'index.html'),
              path.join(path.dirname(process.execPath), 'index.html')
            ];
            for (const p of cands) {
              try { return (cache = fs.readFileSync(p, 'utf8')); } catch (e) {}
            }
            return (cache = '<h1>Thieu index.html</h1>');
          }

          export const VERSION = typeof __BUILD_VERSION__ === 'string' ? __BUILD_VERSION__ : 'dev';
          EOF

          cat > src/server.js <<'EOF'
          import http from 'node:http';
          import { exec, execSync } from 'node:child_process';
          import { uiHtml, VERSION } from './ui.js';
          import { cfg, save } from './core/store.js';

          const HOST = '127.0.0.1';
          const FALLBACK_PORTS = [3890, 4200, 4500, 4800, 5000, 5500, 6000, 7000, 8000, 8080, 8443, 9000, 10000, 12345];

          function readExcluded() {
            const rs = [];
            if (process.platform !== 'win32') return rs;
            try {
              const out = execSync('netsh interface ipv4 show excludedportrange protocol=tcp', { encoding: 'utf8', windowsHide: true });
              for (const line of out.split(/\r?\n/)) {
                const m = line.match(/^\s*(\d{2,5})\s+(\d{2,5})\s*\*?\s*$/);
                if (m) rs.push([Number(m[1]), Number(m[2])]);
              }
            } catch (e) {}
            return rs;
          }

          function inRanges(p, rs) {
            for (const r of rs) if (p >= r[0] && p <= r[1]) return true;
            return false;
          }

          function buildCandidates(preferred, rs) {
            const out = [], seen = new Set();
            const push = function (p) {
              if (p < 1024 || p > 65535 || seen.has(p) || inRanges(p, rs)) return;
              seen.add(p); out.push(p);
            };
            let p = preferred, guard = 0;
            while (out.length < 24 && p <= 65535 && guard++ < 5000) {
              push(p);
              let jump = p + 1;
              for (const r of rs) if (p >= r[0] && p <= r[1] && r[1] + 1 > jump) jump = r[1] + 1;
              p = jump;
            }
            for (const f of FALLBACK_PORTS) push(f);
            return out;
          }

          export function startServer(engine, opts) {
            opts = opts || {};
            const open = opts.open !== false;
            const sse = new Set();

            engine.log = function (lv, msg) {
              const frame = 'data: ' + JSON.stringify({ t: Date.now(), lv: lv, msg: msg }) + '\n\n';
              for (const r of sse) { try { r.write(frame); } catch (e) {} }
              console.log('[' + lv + '] ' + msg);
            };

            function handler(req, res) {
              const u = new URL(req.url, 'http://localhost');
              const J = function (code, obj, type) {
                res.writeHead(code, { 'Content-Type': (type || 'application/json') + '; charset=utf-8', 'Cache-Control': 'no-store' });
                res.end(typeof obj === 'string' ? obj : JSON.stringify(obj));
              };
              const B = async function () {
                let d = '';
                for await (const chunk of req) d += chunk;
                try { return JSON.parse(d || '{}'); } catch (e) { return {}; }
              };

              (async function () {
                try {
                  if (u.pathname === '/' || u.pathname === '/index.html') return J(200, uiHtml(), 'text/html');

                  if (u.pathname === '/api/logs') {
                    res.writeHead(200, { 'Content-Type': 'text/event-stream', 'Cache-Control': 'no-cache', Connection: 'keep-alive', 'X-Accel-Buffering': 'no' });
                    res.write(':ok\n\n');
                    sse.add(res);
                    const hb = setInterval(function () { try { res.write(':hb\n\n'); } catch (e) {} }, 15000);
                    req.on('close', function () { clearInterval(hb); sse.delete(res); });
                    return;
                  }

                  if (u.pathname === '/api/state') {
                    return J(200, {
                      version: VERSION,
                      token: cfg().token,
                      running: engine.running,
                      me: engine.state.me,
                      orbs: engine.state.orbs,
                      quests: engine.state.quests,
                      blockedUntil: engine.state.blockedUntil,
                      stats: engine.state.stats,
                      settings: {
                        minDelayMs: cfg().minDelayMs,
                        maxDelayMs: cfg().maxDelayMs,
                        heartbeatSec: cfg().heartbeatSec,
                        videoIntervalMs: cfg().videoIntervalMs,
                        maxRetries: cfg().maxRetries,
                        maxConcurrent: cfg().maxConcurrent,
                        autoEnroll: cfg().autoEnroll,
                        autoClaim: cfg().autoClaim,
                        skipStream: cfg().skipStream,
                        exclude: cfg().exclude
                      }
                    });
                  }

                  if (u.pathname === '/api/debug') {
                    return J(200, { debug: engine.state.debug, raw: engine.client.lastQuestPayload });
                  }

                  if (u.pathname === '/api/token' && req.method === 'POST') {
                    const b = await B();
                    save({ token: String(b.token || '').trim() });
                    engine.client.token = cfg().token;
                    engine.log('ok', 'Da luu token');
                    if (!engine.running && cfg().token) engine.watch().catch(function (e) { engine.log('err', e.message); });
                    return J(200, { ok: true });
                  }

                  if (u.pathname === '/api/settings' && req.method === 'POST') {
                    save(await B());
                    return J(200, { ok: true });
                  }

                  if (u.pathname === '/api/scan' && req.method === 'POST') {
                    await engine.scan();
                    return J(200, { ok: true });
                  }

                  if (u.pathname === '/api/run' && req.method === 'POST') {
                    J(200, { ok: true });
                    engine.runOnce().catch(function (e) { engine.log('err', e.message); });
                    return;
                  }

                  if (u.pathname === '/api/claim' && req.method === 'POST') {
                    const b = await B();
                    const r = await engine.client.claim(b.id);
                    const bad = (r && r.errors && r.errors.length) || (r && r.code);
                    if (!bad) engine.log('ok', 'Da claim ' + b.id);
                    return J(200, { ok: !bad, res: r });
                  }

                  if (u.pathname === '/api/engine/start' && req.method === 'POST') {
                    if (!engine.running) engine.watch().catch(function (e) { engine.log('err', e.message); });
                    return J(200, { ok: true });
                  }

                  if (u.pathname === '/api/engine/stop' && req.method === 'POST') {
                    engine.halt();
                    return J(200, { ok: true });
                  }

                  J(404, { error: 'not found' });
                } catch (e) {
                  J(500, { error: e.message });
                }
              })();
            }

            let active = null;

            function tryListen(port) {
              return new Promise(function (resolve) {
                const s = http.createServer(handler);
                let done = false;
                const fin = function (v) { if (done) return; done = true; resolve(v); };
                s.once('error', function () { fin(null); });
                s.once('listening', function () { fin(s); });
                s.listen(port, HOST);
              });
            }

            function announce(port) {
              const url = 'http://' + HOST + ':' + port;
              if (Number(cfg().port) !== port) save({ port: port });
              console.log('\n  ======================================');
              console.log('   Discord Quests Auto  v' + VERSION);
              console.log('  ======================================');
              console.log('  UI      : ' + url);
              console.log('  Debug   : ' + url + '/api/debug');
              console.log('  Du lieu : ' + cfg().dataDir + '\n');
              if (open) {
                const c = process.platform === 'win32'
                  ? 'start "" "' + url + '"'
                  : process.platform === 'darwin' ? 'open "' + url + '"' : 'xdg-open "' + url + '"';
                exec(c, function () {});
              }
            }

            (async function () {
              const preferred = Math.min(65535, Math.max(1024, Number(process.env.DQA_PORT) || Number(cfg().port) || 3636));
              const rs = readExcluded();
              if (rs.length) console.log('  Windows dang khoa ' + rs.length + ' dai cong (Hyper-V/WSL/Docker) - dang do cong trong...');
              for (const p of buildCandidates(preferred, rs)) {
                const s = await tryListen(p);
                if (s) {
                  active = s;
                  if (p !== preferred) console.log('  ! Cong ' + preferred + ' bi chiem -> dung cong ' + p);
                  return announce(p);
                }
              }
              console.error('\n  Khong tim duoc cong nao. Chay Admin: net stop winnat && net start winnat\n');
            })();

            process.on('SIGINT', function () {
              engine.halt();
              if (active) active.close();
              process.exit(0);
            });

            return { close: function () { if (active) active.close(); } };
          }
          EOF

          cat > src/cli.js <<'EOF'
          import { cfg, save, nodeStorage, DATA_DIR } from './core/store.js';
          import { Engine } from './core/engine.js';
          import { startServer } from './server.js';
          import { VERSION } from './ui.js';

          const args = process.argv.slice(2);
          const has = function (f) { return args.indexOf(f) > -1; };
          const val = function (f) { const i = args.indexOf(f); return i > -1 ? args[i + 1] : null; };
          const C = { info: '\x1b[36m', ok: '\x1b[32m', warn: '\x1b[33m', err: '\x1b[31m', dim: '\x1b[90m' };
          const log = function (lv, m) {
            console.log((C[lv] || '') + '[' + new Date().toLocaleTimeString('vi-VN') + '] ' + m + '\x1b[0m');
          };

          main().catch(function (e) { console.error(e); process.exit(1); });

          async function main() {
            if (val('--token')) save({ token: String(val('--token')).trim() });
            if (val('--port')) {
              const p = Number(val('--port'));
              if (Number.isFinite(p) && p >= 1024 && p <= 65535) save({ port: p });
            }

            const token = (cfg().token || process.env.DISCORD_TOKEN || '').trim();
            const engine = new Engine({ token: token, getConfig: cfg, onLog: log, storage: nodeStorage });

            console.log('');
            console.log('   ==============================================');
            console.log('    Discord Quests Auto   v' + VERSION);
            console.log('    API theo docs.discord.food/resources/quests');
            console.log('    Du lieu: ' + DATA_DIR);
            console.log('   ==============================================');
            console.log('');

            if (has('--once')) {
              if (!token) { console.error('Thieu token'); process.exit(1); }
              try { await engine.scan(); } catch (e) { log('err', 'scan: ' + e.message); }
              try { await engine.runOnce(); } catch (e) { log('err', 'run: ' + e.message); }
              log('ok', 'Xong. ok=' + engine.state.stats.ok + ' fail=' + engine.state.stats.fail);
              process.exit(0);
            }

            if (has('--watch') && !has('--server')) {
              if (!token) { console.error('Thieu token'); process.exit(1); }
              await engine.scan();
              await engine.watch();
              return;
            }

            startServer(engine, { open: !has('--no-open') });

            if (token) {
              try { await engine.scan(); } catch (e) { log('err', e.message); }
              engine.watch().catch(function (e) { log('err', e.message); });
            } else {
              log('warn', 'Chua co token - dan vao web roi bam Luu token.');
            }
          }
          EOF

      # ══════════════ 4. build.mjs ══════════════
      - name: Tạo build.mjs
        shell: bash
        run: |
          cat > build.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import { execSync } from 'node:child_process';
          import * as esbuild from 'esbuild';

          const root = process.cwd();
          const pkg = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8'));
          const work = path.join(root, 'out', '.build');
          const outDir = path.join(root, 'out');

          fs.rmSync(work, { recursive: true, force: true });
          fs.mkdirSync(work, { recursive: true });
          fs.mkdirSync(outDir, { recursive: true });

          const isWin = process.platform === 'win32';
          const bundle = path.join(work, 'bundle.cjs');
          const blob = path.join(work, 'sea-prep.blob');
          const exe = path.join(outDir, isWin
            ? 'DiscordQuestsAuto-v' + pkg.version + '.exe'
            : 'DiscordQuestsAuto-v' + pkg.version + '-' + process.platform + '-' + process.arch);

          console.log('[1/5] Bundle code + index.html...');
          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');

          await esbuild.build({
            entryPoints: [path.join(root, 'src', 'cli.js')],
            bundle: true,
            platform: 'node',
            target: 'node20',
            format: 'cjs',
            outfile: bundle,
            minify: true,
            legalComments: 'none',
            loader: { '.html': 'text' },
            define: {
              __INDEX_HTML__: JSON.stringify(html),
              __BUILD_VERSION__: JSON.stringify(pkg.version)
            }
          });

          console.log('[2/5] SEA config...');
          fs.writeFileSync(path.join(work, 'sea-config.json'), JSON.stringify({
            main: bundle, output: blob, disableExperimentalSEAWarning: true,
            useSnapshot: false, useCodeCache: false
          }, null, 2));
          execSync('node --experimental-sea-config sea-config.json', { cwd: work, stdio: 'inherit' });

          console.log('[3/5] Copy runtime Node...');
          fs.copyFileSync(process.execPath, exe);

          console.log('[4/5] Go chu ky...');
          if (isWin) {
            try { execSync('signtool remove /s "' + exe + '"', { stdio: 'ignore' }); console.log('   da go'); }
            catch (e) { console.log('   bo qua (khong co signtool)'); }
          } else {
            try { execSync('codesign --remove-signature "' + exe + '"', { stdio: 'ignore' }); } catch (e) {}
          }

          console.log('[5/5] Inject blob...');
          execSync(
            'npx --yes postject "' + exe + '" NODE_SEA_BLOB "' + blob +
            '" --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2',
            { stdio: 'inherit' }
          );

          fs.rmSync(work, { recursive: true, force: true });
          console.log('');
          console.log('OK: ' + path.basename(exe) + '  (' + (fs.statSync(exe).size / 1048576).toFixed(1) + ' MB)');
          EOF

      # ══════════════ 5. BUILD ══════════════
      - name: Cài esbuild
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Build exe
        shell: bash
        run: node build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: DiscordQuestsAuto-exe
          path: out/*.exe
          retention-days: 90

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          generate_release_notes: true
