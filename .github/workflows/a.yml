            const srv = http.createServer(function (req, res) {
              const u = new URL(req.url, 'http://localhost');

              const J = function (code, obj, type) {
                res.writeHead(code, {
                  'Content-Type': (type || 'application/json') + '; charset=utf-8',
                  'Cache-Control': 'no-store'
                });
                res.end(typeof obj === 'string' ? obj : JSON.stringify(obj));
              };

              const B = async function () {
                let d = '';
                for await (const chunk of req) d += chunk;
                try { return JSON.parse(d || '{}'); } catch (e) { return {}; }
              };

              (async function () {
                try {
                  if (u.pathname === '/' || u.pathname === '/index.html') return J(200, uiHtml(), 'text/html');

                  if (u.pathname === '/api/logs') {
                    res.writeHead(200, {
                      'Content-Type': 'text/event-stream',
                      'Cache-Control': 'no-cache',
                      Connection: 'keep-alive',
                      'X-Accel-Buffering': 'no'
                    });
                    res.write(':ok\n\n');
                    sse.add(res);
                    const hb = setInterval(function () { try { res.write(':hb\n\n'); } catch (e) {} }, 15000);
                    req.on('close', function () { clearInterval(hb); sse.delete(res); });
                    return;
                  }

                  if (u.pathname === '/api/state') {
                    return J(200, {
                      version: VERSION,
                      token: cfg().token,
                      running: engine.running,
                      me: engine.state.me,
                      orbs: engine.state.orbs,
                      quests: engine.state.quests,
                      stats: engine.state.stats,
                      settings: {
                        minDelayMs: cfg().minDelayMs,
                        maxDelayMs: cfg().maxDelayMs,
                        heartbeatSec: cfg().heartbeatSec,
                        maxRetries: cfg().maxRetries,
                        autoEnroll: cfg().autoEnroll,
                        autoClaim: cfg().autoClaim,
                        exclude: cfg().exclude
                      }
                    });
                  }

                  if (u.pathname === '/api/token' && req.method === 'POST') {
                    const b = await B();
                    save({ token: String(b.token || '').trim() });
                    engine.client.token = cfg().token;
                    engine.log('ok', 'Da luu token');
                    if (!engine.running && cfg().token) engine.watch().catch(function (e) { engine.log('err', e.message); });
                    return J(200, { ok: true });
                  }

                  if (u.pathname === '/api/settings' && req.method === 'POST') {
                    save(await B());
                    return J(200, { ok: true });
                  }

                  if (u.pathname === '/api/scan' && req.method === 'POST') {
                    await engine.scan();
                    return J(200, { ok: true });
                  }

                  if (u.pathname === '/api/run' && req.method === 'POST') {
                    J(200, { ok: true });
                    engine.runOnce().catch(function (e) { engine.log('err', e.message); });
                    return;
                  }

                  if (u.pathname === '/api/engine/start' && req.method === 'POST') {
                    if (!engine.running) engine.watch().catch(function (e) { engine.log('err', e.message); });
                    return J(200, { ok: true });
                  }

                  if (u.pathname === '/api/engine/stop' && req.method === 'POST') {
                    engine.halt();
                    return J(200, { ok: true });
                  }

                  J(404, { error: 'not found' });
                } catch (e) {
                  J(500, { error: e.message });
                }
              })();
            });

            const port = cfg().port;

            srv.on('error', function (e) {
              if (e.code === 'EADDRINUSE') {
