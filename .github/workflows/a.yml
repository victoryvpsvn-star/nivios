          const API = 'https://discord.com/api/v9';
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36';

          export const ENDPOINTS = {
            me:            { m: 'GET',  p: '/users/@me' },
            userGuilds:    { m: 'GET',  p: '/users/@me/guilds' },
            entitlements:  { m: 'GET',  p: '/users/@me/entitlements' },
            quests:        { m: 'GET',  p: '/quests/@me' },
            enroll:        { m: 'POST', p: '/quests/{id}/enroll' },
            videoProgress: { m: 'POST', p: '/quests/{id}/video-progress' },
            heartbeat:     { m: 'POST', p: '/quests/{id}/heartbeat' },
            claimReward:   { m: 'POST', p: '/quests/{id}/claim-reward' },
            guildChannels: { m: 'GET',  p: '/guilds/{id}/channels' }
          };

          const mem = new Map();
          export const memoryStorage = {
            get: (k) => (mem.has(k) ? mem.get(k) : null),
            set: (k, v) => { mem.set(k, v); }
          };

          export const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          export function gauss() {
            let u = 0, v = 0;
            while (!u) u = Math.random();
            while (!v) v = Math.random();
            return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
          }

          export function humanDelay(a, b) {
            const m = (a + b) / 2, s = (b - a) / 6;
            return Math.max(a * 0.5, Math.round(m + gauss() * s));
          }

          export function backoff(base, att, max) {
            const e = Math.min(max, base * Math.pow(2, att));
            return Math.round(e * (0.5 + Math.random() * 0.5));
          }

          export function progressSteps(target, n) {
            const out = [];
            let c = 0;
            while (c < target) {
              c = Math.min(target, c + Math.max(1, Math.round((target / n) * (0.6 + Math.random() * 0.9))));
              out.push(c);
            }
            return out;
          }

          export function rid() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
              const r = (Math.random() * 16) | 0;
              return (c === 'x' ? r : ((r & 3) | 8)).toString(16);
            });
          }

          export class DiscordClient {
            constructor(opts) {
              this.token = opts.token;
              this.getConfig = opts.getConfig;
              this.storage = opts.storage || memoryStorage;
              this.onLog = opts.onLog || function () {};
              this.build = 0;
              this.tokens = 60;
              this.last = Date.now();
            }

            log(lv, m) { this.onLog(lv, m); }

            async rateAcquire() {
              for (;;) {
                const now = Date.now();
                this.tokens = Math.min(60, this.tokens + (now - this.last) * 0.001);
                this.last = now;
                if (this.tokens >= 1) { this.tokens -= 1; return; }
                await sleep(Math.ceil((1 - this.tokens) * 1000) + 25);
              }
            }

            async buildNumber() {
              if (this.build) return this.build;
              const c = await this.storage.get('discordBuild');
              if (c && Date.now() - c.at < 21600000) return (this.build = c.build);
              const urls = ['https://discord.com/app', 'https://discord.com/login'];
              for (const u of urls) {
                try {
                  const h = await (await fetch(u, { headers: { 'User-Agent': UA } })).text();
                  const m = h.match(/"buildNumber"\s*:\s*(\d+)/) || h.match(/assets\/(\d+)\//);
                  if (m) {
                    const b = Number(m[1]);
                    await this.storage.set('discordBuild', { build: b, at: Date.now() });
                    return (this.build = b);
                  }
                } catch (e) {}
              }
              return (this.build = 350000);
            }

            async headers() {
              const b = await this.buildNumber();
              const sp = Buffer.from(JSON.stringify({
                os: 'Windows', browser: 'Chrome', device: '', system_locale: 'en-US',
                browser_user_agent: UA, browser_version: '141.0.0.0', os_version: '10',
                referrer: '', referring_domain: '', release_channel: 'stable',
                client_build_number: b, client_event_source: null,
                client_launch_id: rid(), client_heartbeat_session_id: rid(),
                client_app_state: 'focused'
              })).toString('base64');
              return {
                Authorization: this.token,
                'User-Agent': UA,
                Accept: '*/*',
                'Accept-Language': 'en-US,en;q=0.9',
                'X-Super-Properties': sp,
                'X-Discord-Locale': 'en-US',
                'X-Discord-Timezone': 'Asia/Bangkok',
                'X-Debug-Options': 'bugReporterEnabled',
                Origin: 'https://discord.com',
                Referer: 'https://discord.com/channels/@me'
              };
            }

            async call(key, o) {
              o = o || {};
              const ep = ENDPOINTS[key];
              let url = API + ep.p;
              const params = o.params || {};
              for (const k of Object.keys(params)) url = url.replace('{' + k + '}', params[k]);
              if (o.query) url += '?' + new URLSearchParams(o.query);
              const label = o.label || key;
              const c = this.getConfig();
              let lastPayload = null;

              for (let a = 0; a <= c.maxRetries; a++) {
                if (a === 0 && !o.noDelay) await sleep(humanDelay(c.minDelayMs, c.maxDelayMs));
                await this.rateAcquire();
                try {
                  const r = await fetch(url, {
                    method: ep.m,
                    headers: await this.headers(),
                    body: o.body ? JSON.stringify(o.body) : undefined
                  });
                  if (r.ok) {
                    const t = await r.text();
                    return t ? JSON.parse(t) : {};
                  }
                  const p = await r.json().catch(function () { return {}; });
                  lastPayload = p;

                  if (r.status === 429) {
                    const w = (p.retry_after !== undefined ? p.retry_after : 2) * 1000;
                    this.log('warn', label + ': 429 -> nghi ' + Math.round(w) + 'ms');
                    await sleep(w);
                    continue;
                  }
                  if (r.status === 401) { this.log('err', label + ': token sai'); return p; }
                  if (r.status === 404) return p;
                  if (a >= c.maxRetries) return p;

                  const w = backoff(c.backoffBaseMs, a, c.backoffMaxMs);
                  this.log('dim', label + ': ' + r.status + ' -> backoff ' + w + 'ms');
                  await sleep(w);
                } catch (e) {
                  this.log('warn', label + ': loi mang -> thu lai');
                  if (a >= c.maxRetries) throw e;
                  await sleep(backoff(c.backoffBaseMs, a, c.backoffMaxMs));
                }
              }
              return lastPayload || {};
            }

            me() { return this.call('me', { label: 'me' }); }
            myQuests() { return this.call('quests', { query: { with_application: true }, label: 'quests' }); }
            enroll(id) { return this.call('enroll', { params: { id: id }, body: { location: 11, is_targeted: false }, label: 'enroll' }); }
            videoProgress(id, ts) { return this.call('videoProgress', { params: { id: id }, body: { timestamp: ts }, noDelay: true, label: 'video ' + ts + 's' }); }
            heartbeat(id, sk, term) { return this.call('heartbeat', { params: { id: id }, body: { stream_key: sk, terminal: !!term }, noDelay: true, label: 'heartbeat' }); }
            claim(id) { return this.call('claimReward', { params: { id: id }, body: { platform: 0, location: 11, is_targeted: false }, label: 'claim' }); }
            entitlements() { return this.call('entitlements', { query: { exclude_consumed: true }, label: 'entitlements' }); }
            guilds() { return this.call('userGuilds', { label: 'guilds' }); }
            channels(g) { return this.call('guildChannels', { params: { id: g }, label: 'channels' }); }

            async orbs() {
              const l = await this.entitlements();
              const arr = Array.isArray(l) ? l : ((l && l.entitlements) || []);
              return arr
                .filter(function (e) { return String(e.application_id) === '1004729762109481020' || e.sku_id; })
                .reduce(function (s, e) { return s + (e.quantity || 1); }, 0);
            }

            async findVoiceChannel() {
              const g = await this.guilds();
              const list = (Array.isArray(g) ? g : []).slice(0, 5);
              for (const x of list) {
                const ch = await this.channels(x.id);
                const v = (Array.isArray(ch) ? ch : []).find(function (c) { return c.type === 2 || c.type === 13; });
                if (v) return v.id;
              }
              return '1';
            }
          }
          EOF

