                     ' Electron/' + ELECTRON + ' Safari/537.36';

          // location = quest content type; 11 = QUEST_HOME_DESKTOP
          export const LOCATION = 11;
          // platform: 0 = CROSS_PLATFORM
          export const PLATFORM = 0;

          export const ENDPOINTS = {
            me:            { m: 'GET',  p: '/users/@me' },
            userGuilds:    { m: 'GET',  p: '/users/@me/guilds' },
            entitlements:  { m: 'GET',  p: '/users/@me/entitlements' },
            quests:        { m: 'GET',  p: '/quests/@me' },
            claimed:       { m: 'GET',  p: '/quests/@me/claimed' },
            questConfig:   { m: 'GET',  p: '/quests/{id}' },
            enroll:        { m: 'POST', p: '/quests/{id}/enroll' },
            videoProgress: { m: 'POST', p: '/quests/{id}/video-progress' },
            heartbeat:     { m: 'POST', p: '/quests/{id}/heartbeat' },
            claimReward:   { m: 'POST', p: '/quests/{id}/claim-reward' },
            guildChannels: { m: 'GET',  p: '/guilds/{id}/channels' }
          };

          const mem = new Map();
          export const memoryStorage = {
            get: (k) => (mem.has(k) ? mem.get(k) : null),
            set: (k, v) => { mem.set(k, v); }
          };

          export const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          export function gauss() {
            let u = 0, v = 0;
            while (!u) u = Math.random();
            while (!v) v = Math.random();
            return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
          }

          export function humanDelay(a, b) {
            const m = (a + b) / 2, s = (b - a) / 6;
            return Math.max(a * 0.5, Math.round(m + gauss() * s));
          }

          export function backoff(base, att, max) {
            const e = Math.min(max, base * Math.pow(2, att));
            return Math.round(e * (0.5 + Math.random() * 0.5));
          }

          export function rid() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
              const r = (Math.random() * 16) | 0;
              return (c === 'x' ? r : ((r & 3) | 8)).toString(16);
            });
          }

          // ───────── doc payload khoan dung ─────────
          export function asArray(v) {
            if (!v) return [];
            if (Array.isArray(v)) return v;
            if (typeof v === 'object') return Object.values(v);
            return [];
          }

          export function extractQuests(p) {
            if (!p) return [];
            if (Array.isArray(p)) return p;
            for (const k of ['quests', 'Quests', 'quest_list', 'items', 'entries']) {
              const a = asArray(p[k]);
              if (a.length) return a;
            }
            for (const k of Object.keys(p)) {
              const v = p[k];
              if (v && typeof v === 'object' && !Array.isArray(v)) {
                for (const k2 of ['quests', 'items', 'entries', 'data']) {
                  const a = asArray(v[k2]);
                  if (a.length) return a;
                }
              }
            }
            return [];
          }

          export function describePayload(p) {
            if (p === null || p === undefined) return 'null';
            if (Array.isArray(p)) return 'array(' + p.length + ')';
            if (typeof p !== 'object') return typeof p;
            const parts = ['keys=' + (Object.keys(p).join(',') || '-')];
            for (const k of ['quests', 'excluded_quests', 'items', 'data', 'entitlements']) {
              if (Array.isArray(p[k])) parts.push(k + '=' + p[k].length);
            }
            if (p.message) parts.push('msg=' + String(p.message).slice(0, 60));
            if (p._error) parts.push('err=' + p._error);
            return parts.join(' | ');
          }

          export class DiscordClient {
            constructor(opts) {
              this.token = opts.token;
              this.getConfig = opts.getConfig;
              this.storage = opts.storage || memoryStorage;
              this.onLog = opts.onLog || function () {};
              this.build = 0;
              this.tokens = 60;
              this.last = Date.now();
              this.lastQuestPayload = null;
            }

            log(lv, m) { this.onLog(lv, m); }

            async rateAcquire() {
              for (;;) {
                const now = Date.now();
                this.tokens = Math.min(60, this.tokens + (now - this.last) * 0.001);
                this.last = now;
                if (this.tokens >= 1) { this.tokens -= 1; return; }
                await sleep(Math.ceil((1 - this.tokens) * 1000) + 25);
              }
            }

            async buildNumber() {
              if (this.build) return this.build;
              const c = await this.storage.get('discordBuild');
              if (c && Date.now() - c.at < 21600000) return (this.build = c.build);
              for (const u of ['https://discord.com/app', 'https://discord.com/login']) {
                try {
                  const h = await (await fetch(u, { headers: { 'User-Agent': UA } })).text();
                  const m = h.match(/"buildNumber"\s*:\s*(\d+)/) || h.match(/assets\/(\d+)\//);
                  if (m) {
                    const b = Number(m[1]);
                    await this.storage.set('discordBuild', { build: b, at: Date.now() });
                    return (this.build = b);
                  }
                } catch (e) {}
              }
              return (this.build = 350000);
            }

            async headers() {
              const b = await this.buildNumber();
              const sp = Buffer.from(JSON.stringify({
                os: 'Windows',
                browser: 'Discord Client',
                device: '',
                system_locale: 'en-US',
                browser_user_agent: UA,
                browser_version: ELECTRON,
                os_version: '10',
                referrer: '',
                referring_domain: '',
                release_channel: 'stable',
                client_build_number: b,
                client_event_source: null,
                client_launch_id: rid(),
                client_heartbeat_session_id: rid(),
                client_app_state: 'focused'
              })).toString('base64');
              return {
                Authorization: this.token,
                'User-Agent': UA,
                Accept: '*/*',
                'Accept-Language': 'en-US,en;q=0.9',
                'X-Super-Properties': sp,
                'X-Discord-Locale': 'en-US',
                'X-Discord-Timezone': 'Asia/Bangkok',
                'X-Debug-Options': 'bugReporterEnabled',
                Origin: 'https://discord.com',
                Referer: 'https://discord.com/channels/@me'
              };
            }

            async raw(method, path, body) {
              const url = /^https?:/.test(path) ? path : API + path;
              await this.rateAcquire();
              try {
                const r = await fetch(url, {
                  method: method,
                  headers: await this.headers(),
                  body: body ? JSON.stringify(body) : undefined
                });
                const t = await r.text();
                let data = {};
                try { data = t ? JSON.parse(t) : {}; } catch (e) { data = { _text: t.slice(0, 400) }; }
                return { status: r.status, data: data };
              } catch (e) {
                return { status: 0, data: { _error: e.message } };
              }
            }

            async call(key, o) {
              o = o || {};
              const ep = ENDPOINTS[key];
              let url = API + ep.p;
              for (const k of Object.keys(o.params || {})) url = url.replace('{' + k + '}', o.params[k]);
              if (o.query) url += '?' + new URLSearchParams(o.query);
              const label = o.label || key;
              const c = this.getConfig();
              let lastPayload = null;

              for (let a = 0; a <= c.maxRetries; a++) {
                if (a === 0 && !o.noDelay) await sleep(humanDelay(c.minDelayMs, c.maxDelayMs));
                await this.rateAcquire();
                try {
                  const r = await fetch(url, {
                    method: ep.m,
                    headers: await this.headers(),
                    body: o.body ? JSON.stringify(o.body) : undefined
                  });
                  if (r.ok) {
                    const t = await r.text();
                    return t ? JSON.parse(t) : {};
                  }
                  const p = await r.json().catch(function () { return {}; });
                  lastPayload = p;

                  if (r.status === 429) {
                    const w = (p.retry_after !== undefined ? p.retry_after : 2) * 1000;
                    this.log('warn', label + ': 429 -> nghi ' + Math.round(w) + 'ms');
                    await sleep(w);
                    continue;
                  }
                  if (r.status === 401) { this.log('err', label + ': 401 - token sai hoac thieu Electron trong UA'); return p; }
                  if (r.status === 403) { this.log('warn', label + ': 403 - task nay can OAuth/telemetry that'); return p; }
                  if (r.status === 404) return p;
                  if (a >= c.maxRetries) return p;

                  const w = backoff(c.backoffBaseMs, a, c.backoffMaxMs);
                  this.log('dim', label + ': ' + r.status + ' -> backoff ' + w + 'ms');
                  await sleep(w);
                } catch (e) {
                  this.log('warn', label + ': loi mang -> thu lai');
                  if (a >= c.maxRetries) throw e;
                  await sleep(backoff(c.backoffBaseMs, a, c.backoffMaxMs));
                }
              }
              return lastPayload || {};
            }

            me() { return this.call('me', { label: 'me' }); }

            // GET /quests/@me  ->  {quests, excluded_quests, quest_enrollment_blocked_until}
            async myQuests() {
              const tries = [
                { path: '/quests/@me', label: 'GET /quests/@me' },
                { path: '/quests/@me?with_application=true', label: 'GET /quests/@me?with_application' }
              ];
              let best = null;
              for (const t of tries) {
                const r = await this.raw('GET', t.path);
                r.label = t.label;
                r.url = t.path;
                r.count = extractQuests(r.data).length;
                this.log('dim', t.label + ' -> HTTP ' + r.status + ' | ' + describePayload(r.data) + ' | quests=' + r.count);
                if (r.count > 0) { this.lastQuestPayload = r; return r; }
                if (!best || (r.status === 200 && best.status !== 200)) best = r;
              }
              this.lastQuestPayload = best;
              return best;
            }

            async blockedUntil() {
              const r = await this.raw('GET', '/quests/@me');
              const v = r.data && (r.data.quest_enrollment_blocked_until || r.data.questEnrollmentBlockedUntil);
              return v || null;
            }

            // POST /quests/{id}/enroll   body: { location }
            enroll(id) {
              return this.call('enroll', { params: { id: id }, body: { location: LOCATION }, label: 'enroll' });
            }

            // POST /quests/{id}/video-progress   body: { timestamp } (giay)
            videoProgress(id, ts) {
              const t = Math.max(1, Math.round(ts));
              return this.call('videoProgress', { params: { id: id }, body: { timestamp: t }, noDelay: true, label: 'video ' + t + 's' });
            }

            // POST /quests/{id}/heartbeat   body: { stream_key?, application_id?, terminal? }
            heartbeat(id, streamKey, terminal, appId) {
              const body = {};
              if (streamKey) body.stream_key = streamKey;
              if (appId) body.application_id = appId;
              if (terminal) body.terminal = true;
              return this.call('heartbeat', { params: { id: id }, body: body, noDelay: true, label: 'heartbeat' });
            }

            // POST /quests/{id}/claim-reward   body: { location, platform }
            claim(id) {
              return this.call('claimReward', { params: { id: id }, body: { location: LOCATION, platform: PLATFORM }, label: 'claim' });
            }

            entitlements() { return this.call('entitlements', { query: { exclude_consumed: true }, label: 'entitlements' }); }
            guilds() { return this.call('userGuilds', { label: 'guilds' }); }
            channels(g) { return this.call('guildChannels', { params: { id: g }, label: 'channels' }); }

            async orbs() {
              const l = await this.entitlements();
              const arr = Array.isArray(l) ? l : ((l && l.entitlements) || []);
              return arr
                .filter(function (e) { return String(e.application_id) === '1004729762109481020' || e.sku_id; })
                .reduce(function (s, e) { return s + (e.quantity || 1); }, 0);
