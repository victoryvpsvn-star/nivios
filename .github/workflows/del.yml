name: Build ArpCutter

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 18 * * *'      # 01:00 sang gio Viet Nam, build lai moi ngay
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dong bo gio he thong
        continue-on-error: true
        shell: pwsh
        run: |
          try { Start-Service w32time -ErrorAction Stop } catch { Write-Host $_.Exception.Message }
          w32tm /resync /force
          Get-Date

      - name: Sinh version.h + common.hpp + util.cpp
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference    = 'SilentlyContinue'

          $ver  = "1.0.${{ github.run_number }}"
          $date = (Get-Date).ToUniversalTime().AddHours(7).ToString('yyyy-MM-dd')
          "VER=$ver"   >> $env:GITHUB_OUTPUT
          "DATE=$date" >> $env:GITHUB_OUTPUT

          New-Item -ItemType Directory -Force -Path src | Out-Null

          @(
            "#pragma once",
            "#define APP_VERSION `"$ver`"",
            "#define BUILD_DATE  `"$date`"",
            "#define GH_OWNER    `"${{ github.repository_owner }}`"",
            "#define GH_REPO     `"${{ github.event.repository.name }}`""
          ) | Set-Content -Encoding utf8 src/version.h

          @'
          // common.hpp
          #pragma once

          #define WIN32_LEAN_AND_MEAN
          #include <winsock2.h>
          #include <ws2tcpip.h>
          #include <windows.h>
          #include <cstdint>
          #include <cstring>
          #include <cstdio>
          #include <cstdlib>
          #include <cctype>
          #include <string>
          #include <vector>
          #include <map>
          #include <algorithm>
          #include <mutex>
          #include <atomic>
          #include <thread>
          #include <ctime>

          #if defined(__has_include)
          #  if __has_include("version.h")
          #    include "version.h"
          #  endif
          #endif

          #ifndef APP_VERSION
          #  define APP_VERSION "1.0.0-dev"
          #endif
          #ifndef BUILD_DATE
          #  define BUILD_DATE  "dev"
          #endif
          #ifndef GH_OWNER
          #  define GH_OWNER    "your-github-user"
          #endif
          #ifndef GH_REPO
          #  define GH_REPO     "arpcutter"
          #endif

          struct Mac {
              uint8_t b[6]{};
              bool zero()  const { for (int i = 0; i < 6; i++) if (b[i]) return false; return true; }
              bool valid() const { return !zero(); }
              bool bcast() const { for (int i = 0; i < 6; i++) if (b[i] != 0xFF) return false; return true; }
              std::string str() const;
              std::string win() const;
              static Mac parse(const std::string& s);
              bool operator==(const Mac& o) const { return memcmp(b, o.b, 6) == 0; }
              bool operator!=(const Mac& o) const { return !(*this == o); }
          };

          struct Device {
              std::string mac;
              std::string ip;
              std::string name;
              std::string first;
              std::string last;
              int  seen = 0;
              bool isNew = false;
          };

          std::string  nowStamp();
          std::string  todayStr();
          uint32_t     ipToU32(const std::string& ip);
          std::string  u32ToIp(uint32_t ip);
          std::wstring toWide(const std::string& s);
          std::string  toNarrow(const std::wstring& s);
          std::string  dataDir();
          std::string  exePath();
          bool         isAdmin();
          void         logLine(const std::string& tag, const std::string& msg);
          std::string  runCapture(const std::string& cmd);
          std::string  readFile(const std::string& path);
          bool         writeFile(const std::string& path, const std::string& data);
          bool         fileExists(const std::string& path);
          '@ | Set-Content -Encoding utf8 src/common.hpp

          @'
          // util.cpp
          #include "common.hpp"
          #include <shlobj.h>
          #include <iostream>

          #pragma comment(lib, "shell32.lib")
          #pragma comment(lib, "ws2_32.lib")

          static std::mutex g_logMtx;

          std::string Mac::str() const {
              char buf[32];
              sprintf_s(buf, "%02X:%02X:%02X:%02X:%02X:%02X",
                        b[0], b[1], b[2], b[3], b[4], b[5]);
              return buf;
          }

          std::string Mac::win() const {
              char buf[32];
              sprintf_s(buf, "%02X-%02X-%02X-%02X-%02X-%02X",
                        b[0], b[1], b[2], b[3], b[4], b[5]);
              return buf;
          }

          Mac Mac::parse(const std::string& s) {
              Mac m;
              std::string t;
              for (char c : s) if (isxdigit((unsigned char)c)) t += c;
              if (t.size() < 12) return m;
              for (int i = 0; i < 6; i++)
                  m.b[i] = (uint8_t)strtol(t.substr(i * 2, 2).c_str(), nullptr, 16);
              return m;
          }

          std::string nowStamp() {
              time_t t = time(nullptr);
              tm lt{};
              localtime_s(&lt, &t);
              char b[40];
              strftime(b, sizeof(b), "%Y-%m-%d %H:%M:%S", &lt);
              return b;
          }

          std::string todayStr() {
              time_t t = time(nullptr);
              tm lt{};
              localtime_s(&lt, &t);
              char b[16];
              strftime(b, sizeof(b), "%Y-%m-%d", &lt);
              return b;
          }

          uint32_t ipToU32(const std::string& ip) {
              in_addr a{};
              if (inet_pton(AF_INET, ip.c_str(), &a) != 1) return 0;
              return ntohl(a.s_addr);
          }

          std::string u32ToIp(uint32_t v) {
              in_addr a{};
              a.s_addr = htonl(v);
              char b[32]{};
              inet_ntop(AF_INET, &a, b, sizeof(b));
              return b;
          }

          std::wstring toWide(const std::string& s) {
              if (s.empty()) return L"";
              int n = MultiByteToWideChar(CP_UTF8, 0, s.c_str(), (int)s.size(), nullptr, 0);
              std::wstring w(n, L'\0');
              MultiByteToWideChar(CP_UTF8, 0, s.c_str(), (int)s.size(), &w[0], n);
              return w;
          }

          std::string toNarrow(const std::wstring& w) {
              if (w.empty()) return "";
              int n = WideCharToMultiByte(CP_UTF8, 0, w.c_str(), (int)w.size(),
                                          nullptr, 0, nullptr, nullptr);
              std::string s(n, '\0');
              WideCharToMultiByte(CP_UTF8, 0, w.c_str(), (int)w.size(), &s[0], n, nullptr, nullptr);
              return s;
          }

          std::string dataDir() {
              static std::string cached;
              if (!cached.empty()) return cached;
              char buf[MAX_PATH]{};
              std::string d;
              if (SUCCEEDED(SHGetFolderPathA(nullptr, CSIDL_LOCAL_APPDATA, nullptr, 0, buf)))
                  d = buf;
              else
                  d = ".";
              d += "\\ArpCutter";
              CreateDirectoryA(d.c_str(), nullptr);
              cached = d;
              return cached;
          }

          std::string exePath() {
              char buf[MAX_PATH * 2]{};
              GetModuleFileNameA(nullptr, buf, sizeof(buf));
              return buf;
          }

          bool isAdmin() {
              BOOL res = FALSE;
              SID_IDENTIFIER_AUTHORITY nt = SECURITY_NT_AUTHORITY;
              PSID sid = nullptr;
              if (AllocateAndInitializeSid(&nt, 2, SECURITY_BUILTIN_DOMAIN_RID,
                                           DOMAIN_ALIAS_RID_ADMINS, 0, 0, 0, 0, 0, 0, &sid)) {
                  CheckTokenMembership(nullptr, sid, &res);
                  FreeSid(sid);
              }
              return res != FALSE;
          }

          static WORD colorFor(const std::string& tag) {
              if (tag == "OK")   return 10;
              if (tag == "WARN") return 14;
              if (tag == "ERR")  return 12;
              if (tag == "ARP")  return 11;
              if (tag == "NET")  return 13;
              return 7;
          }

          void logLine(const std::string& tag, const std::string& msg) {
              std::lock_guard<std::mutex> lk(g_logMtx);
              HANDLE h = GetStdHandle(STD_OUTPUT_HANDLE);
              CONSOLE_SCREEN_BUFFER_INFO ci{};
              WORD old = 7;
              if (GetConsoleScreenBufferInfo(h, &ci)) old = ci.wAttributes;
              SetConsoleTextAttribute(h, colorFor(tag));
              std::string line = "[" + nowStamp() + "] [" + tag + "] " + msg;
              std::cout << line << std::endl;
              SetConsoleTextAttribute(h, old);

              FILE* f = fopen((dataDir() + "\\arpcutter.log").c_str(), "a");
              if (f) { fprintf(f, "%s\n", line.c_str()); fclose(f); }
          }

          std::string runCapture(const std::string& cmd) {
              std::string out;
              FILE* f = _popen(cmd.c_str(), "r");
              if (!f) return out;
              char buf[1024];
              while (fgets(buf, sizeof(buf), f)) out += buf;
              _pclose(f);
              return out;
          }

          std::string readFile(const std::string& path) {
              FILE* f = fopen(path.c_str(), "rb");
              if (!f) return "";
              fseek(f, 0, SEEK_END);
              long n = ftell(f);
              fseek(f, 0, SEEK_SET);
              std::string s(n > 0 ? (size_t)n : 0, '\0');
              if (n > 0) fread(&s[0], 1, (size_t)n, f);
              fclose(f);
              return s;
          }

          bool writeFile(const std::string& path, const std::string& data) {
              FILE* f = fopen(path.c_str(), "wb");
              if (!f) return false;
              if (!data.empty()) fwrite(data.data(), 1, data.size(), f);
              fclose(f);
              return true;
          }

          bool fileExists(const std::string& path) {
              DWORD a = GetFileAttributesA(path.c_str());
              return a != INVALID_FILE_ATTRIBUTES && !(a & FILE_ATTRIBUTE_DIRECTORY);
          }
          '@ | Set-Content -Encoding utf8 src/util.cpp

      - name: Sinh net.hpp + net.cpp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          @'
          // net.hpp
          #pragma once
          #include "common.hpp"
          #include <pcap.h>

          struct Adapter {
              int         idx = 0;
              std::string devName;
              std::string desc;
              std::string ip;
              std::string mask;
              Mac         mac;
          };

          std::vector<Adapter> listAdapters();
          int      pickAdapterIndex(const std::vector<Adapter>& list, int forced);
          pcap_t*  openAdapter(const Adapter& a);
          uint32_t defaultGateway(const std::string& localIp);
          void     printAdapters(const std::vector<Adapter>& list);
          '@ | Set-Content -Encoding utf8 src/net.hpp

          @'
          // net.cpp
          #include "net.hpp"
          #include <iphlpapi.h>
          #include <iostream>

          #pragma comment(lib, "iphlpapi.lib")
          #pragma comment(lib, "ws2_32.lib")

          std::vector<Adapter> listAdapters() {
              std::vector<Adapter> out;
              ULONG sz = 32 * 1024;
              std::vector<BYTE> buf(sz);

              ULONG r = GetAdaptersAddresses(
                  AF_INET,
                  GAA_FLAG_INCLUDE_GATEWAYS | GAA_FLAG_SKIP_ANYCAST |
                  GAA_FLAG_SKIP_MULTICAST | GAA_FLAG_SKIP_DNS_SERVER,
                  nullptr, (IP_ADAPTER_ADDRESSES*)buf.data(), &sz);

              if (r == ERROR_BUFFER_OVERFLOW) {
                  buf.resize(sz);
                  r = GetAdaptersAddresses(
                      AF_INET,
                      GAA_FLAG_INCLUDE_GATEWAYS | GAA_FLAG_SKIP_ANYCAST |
                      GAA_FLAG_SKIP_MULTICAST | GAA_FLAG_SKIP_DNS_SERVER,
                      nullptr, (IP_ADAPTER_ADDRESSES*)buf.data(), &sz);
              }
              if (r != NO_ERROR) {
                  logLine("ERR", "GetAdaptersAddresses loi: " + std::to_string(r));
                  return out;
              }

              int idx = 0;
              for (auto* a = (IP_ADAPTER_ADDRESSES*)buf.data(); a; a = a->Next) {
                  if (a->OperStatus != IfOperStatusUp) continue;
                  if (a->IfType == IF_TYPE_SOFTWARE_LOOPBACK) continue;
                  if (a->PhysicalAddressLength != 6) continue;

                  Adapter ad;
                  ad.idx  = ++idx;
                  ad.desc = a->Description ? toNarrow(a->Description) : "?";
                  memcpy(ad.mac.b, a->PhysicalAddress, 6);

                  for (auto* ua = a->FirstUnicastAddress; ua; ua = ua->Next) {
                      if (ua->Address.lpSockaddr->sa_family != AF_INET) continue;
                      auto* sin = (sockaddr_in*)ua->Address.lpSockaddr;
                      ad.ip = u32ToIp(ntohl(sin->sin_addr.s_addr));
                      if (ua->OnLinkPrefixLength > 0 && ua->OnLinkPrefixLength <= 32) {
                          uint32_t m = (ua->OnLinkPrefixLength == 32)
                                       ? 0xFFFFFFFFu
                                       : (0xFFFFFFFFu << (32 - ua->OnLinkPrefixLength));
                          ad.mask = u32ToIp(m);
                      }
                      break;
                  }
                  if (ad.ip.empty() || ad.ip == "0.0.0.0") continue;
                  if (ad.ip.rfind("169.254.", 0) == 0) continue;
                  out.push_back(ad);
              }

              pcap_if_t* devs = nullptr;
              char err[PCAP_ERRBUF_SIZE]{};
              if (pcap_findalldevs(&devs, err) == 0) {
                  for (auto* d = devs; d; d = d->next) {
                      for (auto* ad = d->addresses; ad; ad = ad->next) {
                          if (!ad->addr || ad->addr->sa_family != AF_INET) continue;
                          auto* sin = (sockaddr_in*)ad->addr;
                          std::string ip = u32ToIp(ntohl(sin->sin_addr.s_addr));
                          for (auto& x : out) {
                              if (x.devName.empty() && x.ip == ip) {
                                  x.devName = d->name;
                                  if (d->description && x.desc.empty())
                                      x.desc = d->description;
                              }
                          }
                      }
                  }
                  pcap_freealldevs(devs);
              }

              out.erase(std::remove_if(out.begin(), out.end(),
                        [](const Adapter& a) { return a.devName.empty(); }), out.end());
              return out;
          }

          int pickAdapterIndex(const std::vector<Adapter>& list, int forced) {
              if (list.empty()) return -1;
              if (forced > 0) {
                  for (size_t i = 0; i < list.size(); i++)
                      if (list[i].idx == forced) return (int)i;
              }
              for (size_t i = 0; i < list.size(); i++)
                  if (list[i].ip.rfind("192.168.1.", 0) == 0) return (int)i;
              return 0;
          }

          pcap_t* openAdapter(const Adapter& a) {
              char err[PCAP_ERRBUF_SIZE]{};
              pcap_t* h = pcap_open_live(a.devName.c_str(), 65536, 1, 80, err);
              if (!h) {
                  logLine("ERR", std::string("pcap_open_live that bai: ") + err);
                  logLine("ERR", "Da cai Npcap chua? Tai tai https://npcap.com/#download");
                  return nullptr;
              }
              return h;
          }

          uint32_t defaultGateway(const std::string& localIp) {
              ULONG sz = 32 * 1024;
              std::vector<BYTE> buf(sz);
              ULONG r = GetAdaptersAddresses(AF_INET, GAA_FLAG_INCLUDE_GATEWAYS,
                                             nullptr, (IP_ADAPTER_ADDRESSES*)buf.data(), &sz);
              if (r == ERROR_BUFFER_OVERFLOW) {
                  buf.resize(sz);
                  r = GetAdaptersAddresses(AF_INET, GAA_FLAG_INCLUDE_GATEWAYS,
                                           nullptr, (IP_ADAPTER_ADDRESSES*)buf.data(), &sz);
              }
              if (r != NO_ERROR) return 0;

              for (auto* a = (IP_ADAPTER_ADDRESSES*)buf.data(); a; a = a->Next) {
                  std::string ip;
                  for (auto* ua = a->FirstUnicastAddress; ua; ua = ua->Next) {
                      if (ua->Address.lpSockaddr->sa_family != AF_INET) continue;
                      auto* sin = (sockaddr_in*)ua->Address.lpSockaddr;
                      ip = u32ToIp(ntohl(sin->sin_addr.s_addr));
                      break;
                  }
                  if (!localIp.empty() && ip != localIp) continue;
                  for (auto* g = a->FirstGatewayAddress; g; g = g->Next) {
                      if (g->Address.lpSockaddr->sa_family != AF_INET) continue;
                      auto* sin = (sockaddr_in*)g->Address.lpSockaddr;
                      uint32_t gw = ntohl(sin->sin_addr.s_addr);
                      if (gw) return gw;
                  }
              }
              return 0;
          }

          void printAdapters(const std::vector<Adapter>& list) {
              std::cout << "\n--- Card mang kha dung ---\n";
              for (size_t i = 0; i < list.size(); i++) {
                  printf("  #%d  ip=%-16s mac=%-18s  %s\n",
                         list[i].idx, list[i].ip.c_str(), list[i].mac.str().c_str(),
                         list[i].desc.c_str());
              }
              std::cout << "\n";
          }
          '@ | Set-Content -Encoding utf8 src/net.cpp

      - name: Sinh arp.hpp + arp.cpp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          @'
          // arp.hpp
          #pragma once
          #include "common.hpp"
          #include <pcap.h>

          #pragma pack(push, 1)
          struct EthHdr { uint8_t dst[6]; uint8_t src[6]; uint16_t type; };
          struct ArpHdr {
              uint16_t htype, ptype;
              uint8_t  hlen, plen;
              uint16_t op;
              uint8_t  sha[6];
              uint32_t spa;
              uint8_t  tha[6];
              uint32_t tpa;
          };
          #pragma pack(pop)

          #define ETH_ARP    0x0806
          #define ARP_REQ    1
          #define ARP_REPLY  2

          void arpSend(pcap_t* h, uint16_t op, const Mac& sha, uint32_t spa,
                       const Mac& tha, uint32_t tpa);

          bool arpResolve(pcap_t* h, const Mac& myMac, uint32_t myIp,
                          uint32_t targetIp, Mac& outMac, int timeoutMs = 1200);

          int  arpScan(pcap_t* h, const Mac& myMac, uint32_t myIp, uint32_t mask,
                       std::vector<Device>& out, int totalMs = 6000, bool withNames = true);

          class Spoofer {
          public:
              struct T { uint32_t ip; Mac mac; };

              pcap_t*  h = nullptr;
              Mac      myMac, gwMac;
              uint32_t myIp = 0, gwIp = 0;
              bool     bothWay = false;
              std::vector<T> t_;

              void add(uint32_t ip, const Mac& m);
              void start();
              void stop();
              void restore();

          private:
              std::atomic<bool> run_{ false };
              std::thread       th_;
              void loop();
          };
          '@ | Set-Content -Encoding utf8 src/arp.hpp

          @'
          // arp.cpp
          #include "arp.hpp"
          #include <iostream>

          static std::mutex g_txMtx;

          void arpSend(pcap_t* h, uint16_t op, const Mac& sha, uint32_t spa,
                       const Mac& tha, uint32_t tpa) {
              if (!h) return;

              uint8_t buf[64]{};
              EthHdr* e = (EthHdr*)buf;
              ArpHdr* a = (ArpHdr*)(buf + sizeof(EthHdr));

              if (tha.zero()) memset(e->dst, 0xFF, 6);
              else            memcpy(e->dst, tha.b, 6);

              memcpy(e->src, sha.b, 6);
              e->type = htons(ETH_ARP);

              a->htype = htons(1);
              a->ptype = htons(0x0800);
              a->hlen  = 6;
              a->plen  = 4;
              a->op    = htons(op);
              memcpy(a->sha, sha.b, 6);
              a->spa = htonl(spa);
              memcpy(a->tha, tha.b, 6);
              a->tpa = htonl(tpa);

              std::lock_guard<std::mutex> lk(g_txMtx);
              pcap_sendpacket(h, buf, 60);
          }

          bool arpResolve(pcap_t* h, const Mac& myMac, uint32_t myIp,
                          uint32_t targetIp, Mac& outMac, int timeoutMs) {
              if (!h) return false;

              for (int i = 0; i < 3; i++)
                  arpSend(h, ARP_REQ, myMac, myIp, Mac{}, targetIp);

              DWORD t0 = GetTickCount();
              while (GetTickCount() - t0 < (DWORD)timeoutMs) {
                  pcap_pkthdr* hdr = nullptr;
                  const u_char* data = nullptr;
                  int r = pcap_next_ex(h, &hdr, &data);
                  if (r <= 0) continue;
                  if (hdr->caplen < sizeof(EthHdr) + sizeof(ArpHdr)) continue;

                  ArpHdr* a = (ArpHdr*)(data + sizeof(EthHdr));
                  if (ntohs(a->op) != ARP_REPLY) continue;
                  if (ntohl(a->spa) != targetIp) continue;

                  memcpy(outMac.b, a->sha, 6);
                  return outMac.valid();
              }
              return false;
          }

          static std::string reverseName(uint32_t ip) {
              sockaddr_in sa{};
              sa.sin_family = AF_INET;
              sa.sin_addr.s_addr = htonl(ip);
              char host[NI_MAXHOST]{};
              if (getnameinfo((sockaddr*)&sa, sizeof(sa), host, sizeof(host),
                              nullptr, 0, NI_NAMEREQD) == 0)
                  return host;
              return "";
          }

          int arpScan(pcap_t* h, const Mac& myMac, uint32_t myIp, uint32_t mask,
                      std::vector<Device>& out, int totalMs, bool withNames) {
              if (!h || mask == 0) return 0;

              uint32_t net = myIp & mask;
              uint32_t bc  = net | ~mask;
              uint32_t start = net + 1;
              uint32_t end   = (bc > start) ? bc : start + 1;
              if (end - start > 4096) end = start + 4095;

              int sent = 0;
              for (uint32_t ip = start; ip < end; ip++) {
                  if (ip == myIp) continue;
                  arpSend(h, ARP_REQ, myMac, myIp, Mac{}, ip);
                  if (++sent % 64 == 0) Sleep(3);
              }

              std::map<std::string, size_t> seenIdx;
              DWORD t0 = GetTickCount();
              while (GetTickCount() - t0 < (DWORD)totalMs) {
                  pcap_pkthdr* hdr = nullptr;
                  const u_char* data = nullptr;
                  int r = pcap_next_ex(h, &hdr, &data);
                  if (r <= 0) continue;
                  if (hdr->caplen < sizeof(EthHdr) + sizeof(ArpHdr)) continue;

                  ArpHdr* a = (ArpHdr*)(data + sizeof(EthHdr));
                  uint16_t op = ntohs(a->op);
                  if (op != ARP_REPLY && op != ARP_REQ) continue;

                  uint32_t spa = ntohl(a->spa);
                  if (spa == 0 || spa == myIp) continue;
                  if ((spa & mask) != net) continue;

                  Mac m;
                  memcpy(m.b, a->sha, 6);
                  if (!m.valid() || m.bcast()) continue;
                  if (m.b[0] & 0x01) continue;

                  std::string ms  = m.str();
                  std::string ips = u32ToIp(spa);

                  auto it = seenIdx.find(ms);
                  if (it == seenIdx.end()) {
                      Device d;
                      d.mac = ms;
                      d.ip  = ips;
                      d.first = nowStamp();
                      d.last  = nowStamp();
                      d.seen  = 1;
                      seenIdx[ms] = out.size();
                      out.push_back(d);
                  } else {
                      Device& d = out[it->second];
                      d.last = nowStamp();
                      d.seen++;
                      if (ips != d.ip) d.ip = ips;
                  }
              }

              if (withNames) {
                  for (auto& d : out) {
                      if (!d.name.empty()) continue;
                      std::string n = reverseName(ipToU32(d.ip));
                      if (!n.empty() && n != d.ip) d.name = n;
                  }
              }
              return (int)out.size();
          }

          void Spoofer::add(uint32_t ip, const Mac& m) {
              t_.push_back({ ip, m });
          }

          void Spoofer::start() {
              run_ = true;
              th_ = std::thread([this] { loop(); });
          }

          void Spoofer::stop() {
              if (run_) {
