          @'
          // db.cpp
          #include "db.hpp"
          #include <iostream>

          static std::string jesc(const std::string& s) {
              std::string r;
              for (char c : s) {
                  if (c == '"' || c == '\\') { r += '\\'; r += c; }
                  else if (c == '\n') r += ' ';
                  else r += c;
              }
              return r;
          }

          static std::string jget(const std::string& o, const std::string& key) {
              std::string pat = "\"" + key + "\"";
              size_t p = o.find(pat);
              if (p == std::string::npos) return "";
              p = o.find(':', p);
              if (p == std::string::npos) return "";
              p++;
              while (p < o.size() && (o[p] == ' ' || o[p] == '\t' || o[p] == '\n' || o[p] == '\r')) p++;
              if (p < o.size() && o[p] == '"') {
                  p++;
                  std::string r;
                  while (p < o.size() && o[p] != '"') {
                      if (o[p] == '\\' && p + 1 < o.size()) p++;
                      r += o[p++];
                  }
                  return r;
              }
              std::string r;
              while (p < o.size() && (isdigit((unsigned char)o[p]) || o[p] == '-')) r += o[p++];
              return r;
          }

          std::string Db::path() const { return dataDir() + "\\devices.json"; }

          bool Db::load() {
              std::string s = readFile(path());
              if (s.empty()) return false;

              lastScan  = jget(s, "lastScan");
              lastCheck = jget(s, "lastCheck");

              size_t dp = s.find("\"devices\"");
              if (dp == std::string::npos) return true;
              size_t a = s.find('[', dp);
              size_t e = s.rfind(']');
              if (a == std::string::npos || e == std::string::npos || a > e) return true;

              size_t p = a + 1;
              while (p < e) {
                  size_t b = s.find('{', p);
                  if (b == std::string::npos || b > e) break;
                  int depth = 0;
                  size_t q = b;
                  for (; q < e; q++) {
                      if (s[q] == '{') depth++;
                      else if (s[q] == '}') { depth--; if (depth == 0) { q++; break; } }
                  }
                  std::string obj = s.substr(b, q - b);
                  Device d;
                  d.mac   = jget(obj, "mac");
                  d.ip    = jget(obj, "ip");
                  d.name  = jget(obj, "name");
                  d.first = jget(obj, "first");
                  d.last  = jget(obj, "last");
                  d.seen  = atoi(jget(obj, "seen").c_str());
                  if (!d.mac.empty()) devices.push_back(d);
                  p = q;
              }
              return true;
          }

          bool Db::save() {
              std::string s;
              s += "{\n";
              s += "  \"lastScan\": \"" + jesc(lastScan) + "\",\n";
              s += "  \"lastCheck\": \"" + jesc(lastCheck) + "\",\n";
              s += "  \"devices\": [\n";
              for (size_t i = 0; i < devices.size(); i++) {
                  const Device& d = devices[i];
                  s += "    {\"mac\":\"" + jesc(d.mac) + "\",\"ip\":\"" + jesc(d.ip) +
                       "\",\"name\":\"" + jesc(d.name) + "\",\"first\":\"" + jesc(d.first) +
                       "\",\"last\":\"" + jesc(d.last) + "\",\"seen\":" +
                       std::to_string(d.seen) + "}";
                  if (i + 1 < devices.size()) s += ",";
                  s += "\n";
              }
              s += "  ]\n}\n";
              return writeFile(path(), s);
          }

          Device* Db::byMac(const std::string& mac) {
              std::string k = Mac::parse(mac).str();
              for (auto& d : devices) if (d.mac == k) return &d;
              return nullptr;
          }

          Device* Db::byIp(const std::string& ip) {
              for (auto& d : devices) if (d.ip == ip) return &d;
              return nullptr;
          }

          Device* Db::byIndex(int i) {
              if (i < 0 || i >= (int)devices.size()) return nullptr;
              return &devices[i];
          }

          int Db::merge(const std::vector<Device>& found) {
              int newCount = 0;
              for (const auto& f : found) {
                  Device* d = byMac(f.mac);
                  if (!d) {
                      Device nd = f;
                      nd.first = nowStamp();
                      nd.last  = nowStamp();
                      nd.seen  = 1;
                      nd.isNew = true;
                      devices.push_back(nd);
                      newCount++;
                  } else {
                      if (f.ip != d->ip) d->ip = f.ip;
                      if (!f.name.empty()) d->name = f.name;
                      d->last = nowStamp();
                      d->seen++;
                  }
              }
              return newCount;
          }
