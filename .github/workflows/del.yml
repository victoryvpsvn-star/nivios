          // updater.cpp
          #include "updater.hpp"
          #include <winhttp.h>
          #include <iostream>

          #pragma comment(lib, "winhttp.lib")

          static bool winHttpGet(const std::wstring& url, std::string* bodyOut,
                                 const std::wstring& savePath) {
              URL_COMPONENTS uc{};
              uc.dwStructSize = sizeof(uc);
              wchar_t host[256]{};
              wchar_t path[2048]{};
              uc.lpszHostName = host;  uc.dwHostNameLength = 255;
              uc.lpszUrlPath  = path;  uc.dwUrlPathLength  = 2047;

              if (!WinHttpCrackUrl(url.c_str(), (DWORD)url.size(), 0, &uc))
                  return false;

              bool https = (uc.nScheme == INTERNET_SCHEME_HTTPS);

              HINTERNET s = WinHttpOpen(L"ArpCutter/1.0",
                                        WINHTTP_ACCESS_TYPE_AUTOMATIC_PROXY,
                                        WINHTTP_NO_PROXY_NAME, WINHTTP_NO_PROXY_BYPASS, 0);
              if (!s) return false;

              HINTERNET c = WinHttpConnect(s, host, uc.nPort, 0);
              if (!c) { WinHttpCloseHandle(s); return false; }

              HINTERNET rq = WinHttpOpenRequest(c, L"GET", path, nullptr,
                                                WINHTTP_NO_REFERER,
                                                WINHTTP_DEFAULT_ACCEPT_TYPES,
                                                https ? WINHTTP_FLAG_SECURE : 0);
              if (!rq) { WinHttpCloseHandle(c); WinHttpCloseHandle(s); return false; }

              DWORD policy = WINHTTP_OPTION_REDIRECT_POLICY_ALWAYS;
              WinHttpSetOption(rq, WINHTTP_OPTION_REDIRECT_POLICY, &policy, sizeof(policy));
              WinHttpAddRequestHeaders(rq,
                  L"User-Agent: ArpCutter\r\nAccept: application/vnd.github+json\r\n",
                  -1, WINHTTP_ADDREQ_FLAG_ADD | WINHTTP_ADDREQ_FLAG_REPLACE);

              bool ok = false;
              if (WinHttpSendRequest(rq, WINHTTP_NO_ADDITIONAL_HEADERS, 0,
                                     WINHTTP_NO_REQUEST_DATA, 0, 0, 0) &&
                  WinHttpReceiveResponse(rq, nullptr)) {

                  DWORD status = 0, slen = sizeof(status);
                  WinHttpQueryHeaders(rq,
                      WINHTTP_QUERY_STATUS_CODE | WINHTTP_QUERY_FLAG_NUMBER,
                      WINHTTP_HEADER_NAME_BY_INDEX, &status, &slen, WINHTTP_NO_HEADER_INDEX);

                  if (status == 200) {
                      FILE* f = nullptr;
                      if (!savePath.empty())
                          f = _wfopen(savePath.c_str(), L"wb");

                      DWORD avail = 0;
                      do {
                          avail = 0;
                          if (!WinHttpQueryDataAvailable(rq, &avail)) break;
                          if (avail == 0) break;
                          std::vector<char> buf(avail);
                          DWORD read = 0;
                          if (!WinHttpReadData(rq, buf.data(), avail, &read)) break;
                          if (read == 0) break;
                          if (f) fwrite(buf.data(), 1, read, f);
                          if (bodyOut) bodyOut->append(buf.data(), read);
                      } while (avail > 0);

                      if (f) fclose(f);
                      ok = true;
                  }
              }

              WinHttpCloseHandle(rq);
              WinHttpCloseHandle(c);
              WinHttpCloseHandle(s);
              return ok;
          }

          int cmpVersion(const std::string& a0, const std::string& b0) {
              auto parts = [](const std::string& s) {
                  std::vector<int> v;
                  std::string c;
                  for (char ch : s) {
                      if (ch == '.') { v.push_back(atoi(c.c_str())); c.clear(); }
                      else if (isdigit((unsigned char)ch)) c += ch;
                  }
                  if (!c.empty()) v.push_back(atoi(c.c_str()));
                  return v;
              };
              std::string a = a0, b = b0;
              if (!a.empty() && (a[0] == 'v' || a[0] == 'V')) a = a.substr(1);
              if (!b.empty() && (b[0] == 'v' || b[0] == 'V')) b = b.substr(1);

              auto va = parts(a), vb = parts(b);
              size_t n = va.size() > vb.size() ? va.size() : vb.size();
              for (size_t i = 0; i < n; i++) {
                  int x = i < va.size() ? va[i] : 0;
                  int y = i < vb.size() ? vb[i] : 0;
                  if (x != y) return x < y ? -1 : 1;
              }
              return 0;
          }

          Release fetchLatestRelease() {
              Release r;
              std::string api = "https://api.github.com/repos/" GH_OWNER "/" GH_REPO "/releases/latest";
              std::string body;
              if (!winHttpGet(toWide(api), &body, L"")) {
                  logLine("ERR", "Khong ket noi duoc GitHub API.");
                  return r;
              }

              auto grab = [&](const std::string& key) -> std::string {
                  std::string pat = "\"" + key + "\":\"";
                  size_t p = body.find(pat);
                  if (p == std::string::npos) return "";
                  p += pat.size();
                  size_t e = body.find('"', p);
                  if (e == std::string::npos) return "";
                  return body.substr(p, e - p);
              };

              r.tag     = grab("tag_name");
              r.notes   = grab("body");
              r.version = r.tag;
              if (!r.version.empty() && (r.version[0] == 'v' || r.version[0] == 'V'))
                  r.version = r.version.substr(1);

              size_t p = 0;
              while (true) {
                  p = body.find("browser_download_url", p);
                  if (p == std::string::npos) break;
                  size_t q = body.find('"', p + 21);
                  if (q == std::string::npos) break;
                  size_t e = body.find('"', q + 1);
                  if (e == std::string::npos) break;
                  std::string url = body.substr(q + 1, e - q - 1);
                  if (url.rfind(".exe") != std::string::npos) { r.url = url; break; }
                  p = e;
              }

              r.ok = !r.tag.empty() && !r.url.empty();
              return r;
          }

          bool downloadTo(const std::string& url, const std::string& destPath) {
              return winHttpGet(toWide(url), nullptr, toWide(destPath)) &&
