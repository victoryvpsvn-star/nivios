                  "move /y \"" + tmp + "\" \"" + exe + "\" >nul 2>&1\r\n"
                  "if errorlevel 1 goto wait\r\n"
                  "start \"\" \"" + exe + "\"\r\n"
                  "del \"%~f0\"\r\n";
              writeFile(bat, script);

              std::string cmd = "cmd.exe /c \"" + bat + "\"";
              STARTUPINFOA si{};
              si.cb = sizeof(si);
