          @'
          // protect.cpp
          #include "protect.hpp"
          #include "arp.hpp"
          #include <iostream>

          void addStaticArp(const std::string& ip, const std::string& macDash) {
              runCapture("arp -d " + ip + " >nul 2>&1");
              runCapture("arp -s " + ip + " " + macDash);
          }

          struct Prot {
              pcap_t*  h;
              Mac      myMac, gwMac;
              uint32_t myIp, gwIp;
              bool     aggressive;
              bool     addStatic;

              std::map<std::string, DWORD> lastWarn;
              std::map<std::string, int>   flood;
              DWORD    winStart = 0;
              DWORD    lastGrat = 0;
              DWORD    lastReassert = 0;
              int      spoofGw = 0, spoofMe = 0, floods = 0;

              bool warn(std::string key, int gapMs = 8000) {
                  DWORD now = GetTickCount();
                  auto it = lastWarn.find(key);
                  if (it != lastWarn.end() && now - it->second < (DWORD)gapMs) return false;
                  lastWarn[key] = now;
                  return true;
              }

              void reassertGateway() {
                  for (int i = 0; i < 3; i++) {
                      arpSend(h, ARP_REPLY, gwMac, gwIp, Mac{}, gwIp);
                      Sleep(20);
                  }
              }

              void reassertSelf() {
                  for (int i = 0; i < 3; i++) {
                      arpSend(h, ARP_REPLY, myMac, myIp, Mac{}, myIp);
                      arpSend(h, ARP_REPLY, myMac, myIp, gwMac, gwIp);
                      Sleep(20);
                  }
              }

              void handle(const u_char* data, uint32_t caplen) {
                  if (caplen < sizeof(EthHdr) + sizeof(ArpHdr)) return;
                  ArpHdr* a = (ArpHdr*)(data + sizeof(EthHdr));
                  uint16_t op = ntohs(a->op);
                  if (op != ARP_REPLY && op != ARP_REQ) return;

                  Mac sha;  memcpy(sha.b, a->sha, 6);
                  uint32_t spa = ntohl(a->spa);
                  if (!sha.valid() || sha.bcast()) return;

                  DWORD now = GetTickCount();
                  if (now - winStart > 1000) { flood.clear(); winStart = now; }
                  int& cnt = flood[sha.str()];
                  cnt++;
                  if (cnt == 260 && warn("flood:" + sha.str(), 5000)) {
                      floods++;
                      logLine("WARN", "ARP FLOOD tu " + sha.str() + " (" +
                              u32ToIp(spa) + ") > 260 goi/giay");
                      if (aggressive) reassertGateway();
                  }

                  if (spa == gwIp && sha != gwMac) {
                      if (warn("gw:" + sha.str())) {
                          spoofGw++;
                          logLine("WARN", "ARP SPOOF: " + sha.str() +
                                  " dang mao danh router " + u32ToIp(gwIp));
                      }
                      if (aggressive) reassertGateway();
                  }

                  if (spa == myIp && sha != myMac) {
                      if (warn("me:" + sha.str())) {
                          spoofMe++;
                          logLine("WARN", "ARP SPOOF: " + sha.str() +
                                  " dang mao danh IP may ban " + u32ToIp(myIp));
                      }
                      if (aggressive) reassertSelf();
                  }
              }
          };

          static void runLoop(Prot& p, std::atomic<bool>& run, bool watchOnly) {
              char f[] = "arp";
              bpf_program fp{};
              if (pcap_compile(p.h, &fp, f, 1, 0xFFFFFFFF) == 0) {
                  pcap_setfilter(p.h, &fp);
                  pcap_freecode(&fp);
              }

              if (p.addStatic) {
                  addStaticArp(u32ToIp(p.gwIp), p.gwMac.win());
                  logLine("OK", "Da them ARP tinh cho router " + u32ToIp(p.gwIp) +
                          " -> " + p.gwMac.str());
              }

              p.reassertSelf();
              p.reassertGateway();

              logLine("NET", "Dang bao ve. Nhan Ctrl+C de dung.");
              while (run) {
                  pcap_pkthdr* hdr = nullptr;
                  const u_char* data = nullptr;
                  int r = pcap_next_ex(p.h, &hdr, &data);
                  if (r > 0) p.handle(data, hdr->caplen);

                  DWORD now = GetTickCount();

                  if (!watchOnly && now - p.lastGrat > 2000) {
                      arpSend(p.h, ARP_REPLY, p.myMac, p.myIp, p.gwMac, p.gwIp);
                      p.lastGrat = now;
                  }
                  if (!watchOnly && now - p.lastReassert > 5000) {
                      p.reassertGateway();
                      p.lastReassert = now;
                  }
                  Sleep(5);
              }

              if (p.addStatic) {
                  runCapture("arp -d " + u32ToIp(p.gwIp) + " >nul 2>&1");
                  logLine("NET", "Da xoa ARP tinh cua router.");
              }
              std::cout << "\n--- Bao cao ---\n"
                        << "  Spoof nham router : " << p.spoofGw << "\n"
                        << "  Spoof nham may ban: " << p.spoofMe << "\n"
                        << "  Dot ARP flood     : " << p.floods  << "\n";
          }

          void protectRun(pcap_t* h, const Mac& myMac, uint32_t myIp,
                          const Mac& gwMac, uint32_t gwIp,
                          bool aggressive, bool addStatic, std::atomic<bool>& run) {
              Prot p{};
              p.h = h; p.myMac = myMac; p.myIp = myIp;
              p.gwMac = gwMac; p.gwIp = gwIp;
              p.aggressive = aggressive; p.addStatic = addStatic;
              runLoop(p, run, false);
          }

          void watchRun(pcap_t* h, const Mac& myMac, uint32_t myIp,
                        const Mac& gwMac, uint32_t gwIp, std::atomic<bool>& run) {
              Prot p{};
              p.h = h; p.myMac = myMac; p.myIp = myIp;
              p.gwMac = gwMac; p.gwIp = gwIp;
              p.aggressive = false; p.addStatic = false;
              runLoop(p, run, true);
          }
